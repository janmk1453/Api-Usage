name: CI

on:
  push:
    branches: [dev, main]
  pull_request:
    branches: [dev, main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: 类型检查、单测与产物校验
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: 检出仓库
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: 配置 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: 安装依赖
        run: npm ci --no-audit --no-fund

      - name: 类型检查
        run: npm run typecheck

      - name: 核心单元测试
        run: npm test

      - name: 构建扩展
        run: npm run build

      - name: 检查入口与分包语法
        run: |
          for file in ./*.js; do
            node --check "$file"
          done

      - name: 校验版本、清单与产物引用链
        run: npm run verify:ci

      - name: 校验构建产物已提交
        run: |
          if [ -n "$(git status --porcelain --untracked-files=all)" ]; then
            printf '%s\n' '构建产物或工作区与提交内容不一致：'
            git status --short
            git diff --stat
            exit 1
          fi

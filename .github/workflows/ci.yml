name: CI

on:
  push:
    branches: [dev, main]
  pull_request:
    branches: [dev, main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  verify:
    name: 类型检查、单测与产物校验
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: 检出仓库
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: 配置 Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: 安装依赖
        run: npm ci --no-audit --no-fund

      - name: 类型检查
        run: npm run typecheck

      - name: 核心单元测试
        run: npm test

      - name: 构建扩展
        run: npm run build

      - name: 检查入口与分包语法
        run: |
          for file in ./*.js; do
            node --check "$file"
          done

      - name: 校验版本、清单与产物引用链
        run: npm run verify:ci

      - name: 校验构建产物已提交
        run: |
          if [ -n "$(git status --porcelain --untracked-files=all)" ]; then
            printf '%s\n' '构建产物或工作区与提交内容不一致：'
            git status --short
            git diff --stat
            exit 1
          fi

  preview:
    name: 发布 main 预览版
    runs-on: ubuntu-latest
    needs: verify
    if: github.ref == 'refs/heads/main'
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: 检出仓库
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false

      - name: 配置 Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: 生成预览包并校验结构
        id: package
        run: node scripts/preview-package.mjs "$RUNNER_TEMP/preview" "$GITHUB_SHA"

      - name: 生成预发布说明
        run: node scripts/preview-notes.mjs "$RUNNER_TEMP/preview/release-notes.md" "$GITHUB_SHA"

      - name: 创建或更新预发布
        env:
          TAG: ${{ steps.package.outputs.tag }}
          TITLE: ${{ steps.package.outputs.title }}
          ARCHIVE: ${{ steps.package.outputs.archive }}
          CHECKSUM: ${{ steps.package.outputs.checksum }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            printf '%s\n' "预发布已存在，更新标题、说明与资产：$TAG"
            gh release edit "$TAG" \
              --title "$TITLE" \
              --notes-file "$RUNNER_TEMP/preview/release-notes.md" \
              --draft=false \
              --latest=false \
              --prerelease
            gh release upload "$TAG" "$ARCHIVE" "$CHECKSUM" --clobber
          else
            printf '%s\n' "创建预发布：$TAG"
            gh release create "$TAG" "$ARCHIVE" "$CHECKSUM" \
              --target "$GITHUB_SHA" \
              --title "$TITLE" \
              --notes-file "$RUNNER_TEMP/preview/release-notes.md" \
              --latest=false \
              --prerelease
          fi

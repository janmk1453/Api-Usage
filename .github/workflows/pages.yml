name: 文档 Pages

on:
  push:
    branches: [main]
    paths:
      - docs.html
      - .github/workflows/pages.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    name: 构建文档站点
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: 检出仓库
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: 配置 Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: 准备静态文件
        run: |
          mkdir -p _site
          cp docs.html _site/index.html
          cp docs.html _site/docs.html
          touch _site/.nojekyll

      - name: 上传文档站点
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    name: 发布文档站点
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: 部署 Pages
        id: deployment
        uses: actions/deploy-pages@v4

<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>API用量统计 · 匿名使用统计看板</title>
<style>
  :root {
    --bg: #FFFFFF; --card: #F6F7F8; --inner: #FFFFFF; --text: #111827;
    --text2: #6B7280; --text3: #9CA3AF; --border: #E5E7EB; --orange: #FF6A00;
    --green: #0BA25E; --blue: #2563EB; --radius: 14px;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; padding: 20px 18px 48px; background: var(--bg); color: var(--text);
    font-family: "Microsoft YaHei", -apple-system, "Segoe UI", sans-serif; font-size: 13px; line-height: 1.6;
  }
  h1 { font-size: 17px; font-weight: 600; margin: 0 0 4px; }
  h2 { font-size: 13px; font-weight: 600; margin: 0 0 8px; }
  .sub { color: var(--text2); font-size: 12px; margin-bottom: 14px; }
  .dash-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
  .controls { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
  .pill {
    padding: 6px 12px; border: 1px solid var(--border); border-radius: 999px; background: var(--inner);
    font-size: 12px; color: var(--text); cursor: pointer;
  }
  .pill.active { background: var(--text); color: #FFFFFF; border-color: var(--text); font-weight: 600; }
  .cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; margin-bottom: 16px; }
  .card { background: var(--card); border: 1px solid var(--border); border-radius: var(--radius); padding: 12px 14px; }
  .card .label { font-size: 11px; color: var(--text2); }
  .card .value { font-size: 22px; font-weight: 600; margin-top: 2px; letter-spacing: -0.5px; }
  .card .hint { font-size: 11px; color: var(--text3); }
  section { background: var(--card); border: 1px solid var(--border); border-radius: var(--radius); padding: 14px; margin-bottom: 12px; }
  .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 12px; }
  .grid section { margin-bottom: 0; }
  .bar-row { display: grid; grid-template-columns: 132px 1fr 68px; gap: 8px; align-items: center; margin-bottom: 6px; font-size: 12px; }
  .bar-track { background: var(--border); border-radius: 999px; height: 8px; overflow: hidden; }
  .bar-fill { height: 100%; border-radius: 999px; background: var(--orange); }
  .bar-label { color: var(--text2); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .bar-value { text-align: right; color: var(--text2); font-variant-numeric: tabular-nums; }
  table { width: 100%; border-collapse: collapse; font-size: 12px; }
  th, td { text-align: left; padding: 5px 6px; border-bottom: 1px solid var(--border); }
  th { color: var(--text2); font-weight: 600; }
  td.num { text-align: right; font-variant-numeric: tabular-nums; }
  canvas { width: 100%; height: 190px; display: block; }
  .notice { color: var(--text2); font-size: 12px; }
  .error { color: #DC2626; font-size: 12px; }
</style>
</head>
<body>
<div class="dash-head">
  <div>
    <h1>API用量统计 · 匿名使用统计</h1>
    <div class="sub" id="meta">加载中…</div>
  </div>
  <div class="controls">
    <button class="pill" data-days="7">近 7 天</button>
    <button class="pill active" data-days="30">近 30 天</button>
    <button class="pill" data-days="90">近 90 天</button>
    <button class="pill" data-days="365">近 1 年</button>
    <button class="pill" id="reload">刷新</button>
  </div>
</div>

<div class="cards" id="cards"></div>

<section>
  <h2>日活设备趋势</h2>
  <canvas id="dau-chart"></canvas>
</section>

<section>
  <h2>页面使用率</h2>
  <div id="pages"></div>
</section>

<section>
  <h2>面板渲染耗时分布</h2>
  <div id="render"></div>
  <div class="notice" style="margin-top:6px;">分档：&lt;100ms / &lt;300ms / &lt;800ms / &lt;2000ms / ≥2000ms</div>
</section>

<section>
  <h2>扩展版本分布</h2>
  <div id="versions"></div>
</section>

<div class="grid">
  <section><h2>浏览器</h2><div id="env-browser"></div></section>
  <section><h2>操作系统</h2><div id="env-os"></div></section>
  <section><h2>CPU 架构</h2><div id="env-arch"></div></section>
  <section><h2>语言</h2><div id="env-lang"></div></section>
  <section><h2>窄屏分桶</h2><div id="env-width"></div></section>
  <section><h2>时区偏移</h2><div id="env-tz"></div></section>
  <section><h2>深色偏好</h2><div id="env-dark"></div></section>
  <section><h2>显示形态</h2><div id="env-standalone"></div></section>
  <section><h2>指针类型</h2><div id="env-touch"></div></section>
</div>

<script>
const PAGE_LABELS = {
  overview: '用量概览', stats: '用量统计', history: '历史记录', forecast: '趋势预测',
  wallet: '钱包', settings: '设置', help: '使用说明', about: '关于',
};

let currentDays = 30;
let lastDaily = [];

function fmtInt(value) {
  const num = Number(value) || 0;
  return num.toLocaleString('zh-CN');
}

function fmtDuration(ms) {
  const total = Math.round((Number(ms) || 0) / 1000);
  if (!total) return '0 分钟';
  const hours = Math.floor(total / 3600);
  const minutes = Math.round((total % 3600) / 60);
  return hours ? `${hours} 小时 ${minutes} 分` : `${minutes} 分钟`;
}

function card(label, value, hint) {
  return `<div class="card"><div class="label">${label}</div><div class="value">${value}</div>${hint ? `<div class="hint">${hint}</div>` : ''}</div>`;
}

function renderBars(hostId, items, unit) {
  const host = document.getElementById(hostId);
  if (!host) return;
  const list = Array.isArray(items) ? items.filter((item) => item && item.count > 0) : [];
  if (!list.length) {
    host.innerHTML = '<div class="notice">暂无数据</div>';
    return;
  }
  const max = Math.max(...list.map((item) => Number(item.count) || 0)) || 1;
  const total = list.reduce((sum, item) => sum + (Number(item.count) || 0), 0);
  host.innerHTML = list.map((item) => {
    const count = Number(item.count) || 0;
    const percent = total ? Math.round((count / total) * 1000) / 10 : 0;
    const width = Math.max(2, Math.round((count / max) * 100));
    return `<div class="bar-row"><div class="bar-label" title="${String(item.label)}">${String(item.label)}</div>`
      + `<div class="bar-track"><div class="bar-fill" style="width:${width}%"></div></div>`
      + `<div class="bar-value">${fmtInt(count)}${unit === 'percent' ? ` · ${percent}%` : ''}</div></div>`;
  }).join('');
}

function drawDaily(canvas, rows) {
  if (!canvas) return;
  const dpr = window.devicePixelRatio || 1;
  const width = canvas.clientWidth || 600;
  const height = canvas.clientHeight || 190;
  canvas.width = Math.round(width * dpr);
  canvas.height = Math.round(height * dpr);
  const ctx = canvas.getContext('2d');
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.clearRect(0, 0, width, height);
  if (!rows.length) {
    ctx.fillStyle = '#9CA3AF';
    ctx.font = '12px "Microsoft YaHei", sans-serif';
    ctx.fillText('暂无数据', 12, 24);
    return;
  }
  const padLeft = 34;
  const padRight = 10;
  const padTop = 12;
  const padBottom = 22;
  const plotW = Math.max(10, width - padLeft - padRight);
  const plotH = Math.max(10, height - padTop - padBottom);
  const maxValue = Math.max(1, ...rows.map((row) => Number(row.devices) || 0));
  const stepX = rows.length > 1 ? plotW / (rows.length - 1) : 0;
  const xOf = (index) => padLeft + index * stepX;
  const yOf = (value) => padTop + plotH - (Math.max(0, value) / maxValue) * plotH;

  ctx.strokeStyle = '#E5E7EB';
  ctx.lineWidth = 1;
  for (let i = 0; i <= 4; i++) {
    const y = padTop + (plotH / 4) * i;
    ctx.beginPath();
    ctx.moveTo(padLeft, y);
    ctx.lineTo(width - padRight, y);
    ctx.stroke();
  }
  ctx.fillStyle = '#9CA3AF';
  ctx.font = '11px "Microsoft YaHei", sans-serif';
  ctx.fillText(String(maxValue), 4, padTop + 8);
  ctx.fillText('0', 4, padTop + plotH);

  ctx.beginPath();
  rows.forEach((row, index) => {
    const x = xOf(index);
    const y = yOf(Number(row.devices) || 0);
    if (index === 0) ctx.moveTo(x, y);
    else ctx.lineTo(x, y);
  });
  ctx.strokeStyle = '#FF6A00';
  ctx.lineWidth = 2;
  ctx.stroke();

  ctx.fillStyle = 'rgba(255, 106, 0, 0.10)';
  ctx.beginPath();
  ctx.moveTo(xOf(0), padTop + plotH);
  rows.forEach((row, index) => ctx.lineTo(xOf(index), yOf(Number(row.devices) || 0)));
  ctx.lineTo(xOf(rows.length - 1), padTop + plotH);
  ctx.closePath();
  ctx.fill();

  ctx.fillStyle = '#6B7280';
  const labelCount = Math.min(6, rows.length);
  for (let i = 0; i < labelCount; i++) {
    const index = Math.round((rows.length - 1) * (i / Math.max(1, labelCount - 1)));
    const text = String(rows[index].day).slice(5);
    const x = Math.min(width - padRight - 26, Math.max(padLeft - 6, xOf(index) - 12));
    ctx.fillText(text, x, height - 6);
  }
}

function render(data) {
  document.getElementById('meta').textContent =
    `统计范围：近 ${data.days} 天 · 生成于 ${new Date(data.generatedAt).toLocaleString('zh-CN')}`;
  document.getElementById('cards').innerHTML = [
    card('累计独立用户', fmtInt(data.devices.total), '历史去重设备数'),
    card('今日活跃', fmtInt(data.devices.dau), '按客户端本地日期'),
    card('近 7 天活跃', fmtInt(data.devices.wau), ''),
    card('近 30 天活跃', fmtInt(data.devices.mau), ''),
    card(`近 ${data.days} 天活跃`, fmtInt(data.devices.window), ''),
    card('使用时段', fmtInt(data.usage.sessions), '每次上报计一段'),
    card('打开面板次数', fmtInt(data.usage.opens), ''),
    card('累计使用时长', fmtDuration(data.usage.durMs), '会话时长之和'),
  ].join('');

  lastDaily = Array.isArray(data.daily) ? data.daily : [];
  drawDaily(document.getElementById('dau-chart'), lastDaily);

  const pageTotal = Number(data.pages.total) || 0;
  const pageItems = Object.keys(PAGE_LABELS).map((key) => ({
    label: PAGE_LABELS[key],
    count: Number(data.pages[key]) || 0,
  })).sort((a, b) => b.count - a.count);
  renderBars('pages', pageItems, 'percent');
  if (!pageTotal) document.getElementById('pages').innerHTML = '<div class="notice">暂无数据</div>';

  const renderItems = (data.render || []).map((count, index) => ({
    label: ['<100ms', '<300ms', '<800ms', '<2000ms', '≥2000ms'][index] || String(index),
    count: Number(count) || 0,
  }));
  renderBars('render', renderItems, 'percent');

  renderBars('versions', data.versions || []);
  renderBars('env-browser', data.env?.browser || []);
  renderBars('env-os', data.env?.os || []);
  renderBars('env-arch', data.env?.arch || []);
  renderBars('env-lang', data.env?.lang || []);
  renderBars('env-width', data.env?.width || []);
  renderBars('env-tz', data.env?.tz || []);
  renderBars('env-dark', data.env?.dark || []);
  renderBars('env-standalone', data.env?.standalone || []);
  renderBars('env-touch', data.env?.touch || []);
}

async function load() {
  const meta = document.getElementById('meta');
  try {
    const res = await fetch(`/api/summary?days=${currentDays}`, { headers: { Accept: 'application/json' } });
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    render(await res.json());
  } catch (error) {
    if (meta) meta.innerHTML = `<span class="error">加载失败：${String(error && error.message ? error.message : error)}</span>`;
  }
}

document.querySelectorAll('.pill[data-days]').forEach((button) => {
  button.addEventListener('click', () => {
    document.querySelectorAll('.pill[data-days]').forEach((item) => item.classList.remove('active'));
    button.classList.add('active');
    currentDays = Number(button.getAttribute('data-days')) || 30;
    load();
  });
});
document.getElementById('reload').addEventListener('click', () => load());
window.addEventListener('resize', () => drawDaily(document.getElementById('dau-chart'), lastDaily));
load();
</script>
</body>
</html>

          + '<li><b>用户</b>：设备与环境、软件版本、使用深度三层，不把 20 个维度铺成 20 张图。</li>'
          + '<li><b>性能</b>：先给结论（均值 / P50 / P90），再给版本分布与明细表。</li>'
          + '<li><b>自定义</b>：维度 × 形态 × Top N 的即时探索，可保存视图。</li></ul>'
          + '<h3>技术说明</h3><ul>'
          + '<li>单文件、零外部依赖；图表为自研 SVG 引擎，首屏数据由服务端一次性内联注入。</li>'
          + '<li>渲染耗时默认取最近 30 天；切到性能页并改变时间范围时会向 <code>/api/trend?parts=render</code> 补拉一次。</li>'
          + '<li>支持 <code>prefers-reduced-motion</code>、键盘操作、图表数据表替代视图。</li></ul>'
          + '<p class="muted">构建 <code>' + TEL.data.meta.build + '</code> · 数据更新于 ' + new Date(TEL.data.meta.generatedAt).toLocaleString('zh-CN', { hour12: false }) + '。</p></div>',
      });
    },
    syncURL(push) {
      const p = new URLSearchParams();
      p.set('r', STATE.range.preset === 'custom' ? STATE.range.from + '..' + STATE.range.to : STATE.range.preset);
      if (!STATE.compare) p.set('c', '0');
      if (STATE.granularity === 'hour') p.set('g', 'hour');
      if (STATE.view === 'trends') p.set('m', STATE.chart.metrics.join(','));
      if (STATE.view === 'audience') p.set('tab', STATE.audienceTab);
      if (STATE.view === 'explore') p.set('dim', STATE.explore.dim);
      const url = '#/' + STATE.view + '?' + p.toString();
      try {
        if (push) history.pushState(null, '', url); else history.replaceState(null, '', url);
      } catch (e) { location.hash = url; }
    },
    parse() {
      const m = String(location.hash || '').match(/^#\/([a-z]+)(?:\?(.*))?$/i);
      if (!m) return;
      const view = m[1];
      if (ORDER.indexOf(view) >= 0) STATE.view = view;
      const p = new URLSearchParams(m[2] || '');
      const r = p.get('r');
      if (r) {
        if (/^\d+d$/.test(r)) STATE.range = TEL.core.presetRange(parseInt(r, 10));
        else if (r.includes('..')) {
          const [f, t] = r.split('..');
          STATE.range = TEL.core.normalizeRange(f, t);
        }
      }
      if (p.get('c') === '0') STATE.compare = false;
      if (p.get('g') === 'hour') STATE.granularity = 'hour';
      const mm = p.get('m');
      if (mm) {
        const list = mm.split(',').filter((k) => TEL.core.METRICS[k]).slice(0, 3);
        if (list.length) STATE.chart.metrics = list;
      }
      if (p.get('tab')) STATE.audienceTab = p.get('tab');
      if (p.get('dim')) STATE.explore.dim = p.get('dim');
    },
  };

  /* -------------------------------- 启动外壳 ------------------------------ */
  const STATE = TEL.core.state;

  function bind() {
    document.addEventListener('click', (e) => {
      const nav = e.target.closest && e.target.closest('[data-nav]');
      if (nav) {
        e.preventDefault();
        route.navigate(nav.getAttribute('data-nav'), { push: true });
        return;
      }
      const act = e.target.closest && e.target.closest('[data-act]');
      if (!act) return;
      const name = act.getAttribute('data-act');
      if (name === 'palette') openPalette();
      if (name === 'range') rangePopover(act);
      if (name === 'theme') themeMenu(act);
      if (name === 'export') exportMenu(act);
      if (name === 'compare') route.toggleCompare();
      if (name === 'refresh') route.refresh();
      if (name === 'about') route.about();
      if (name === 'shortcuts') shortcutsSheet();
      if (name === 'rail') {
        STATE.rail = STATE.rail === 'mini' ? 'full' : 'mini';
        document.documentElement.dataset.rail = STATE.rail;
        TEL.core.saveStore();
        setTimeout(() => TEL.charts.redrawAll(), 260);
      }
      if (name === 'more') {
        sheet({
          title: '更多',
          body: '<div class="menu-stack">'
            + '<button class="menu-item" data-more="palette">' + icon('search') + '<span class="menu-txt"><b>搜索或跳转</b><small>指标、页面与操作</small></span></button>'
            + '<button class="menu-item" data-more="refresh">' + icon('refresh') + '<span class="menu-txt"><b>刷新数据</b><small>重新聚合当前视图</small></span></button>'
            + '<button class="menu-item" data-more="compare">' + icon('compare') + '<span class="menu-txt"><b>对比上一周期</b><small>' + (STATE.compare ? '当前已开启' : '当前已关闭') + '</small></span></button>'
            + '<button class="menu-item" data-more="export">' + icon('download') + '<span class="menu-txt"><b>导出 CSV</b><small>当前视图与范围</small></span></button>'
            + '<button class="menu-item" data-more="about">' + icon('info') + '<span class="menu-txt"><b>关于这份设计</b><small>口径与技术说明</small></span></button>'
            + '</div>',
        });
        setTimeout(() => {
          $$('[data-more]').forEach((b) => b.addEventListener('click', () => {
            const k = b.getAttribute('data-more');
            const close = b.closest('.sheet').querySelector('[data-sheet-close]');
            if (k === 'palette') { close.click(); setTimeout(() => openPalette(), 260); }
            if (k === 'refresh') { route.refresh(); close.click(); }
            if (k === 'compare') { route.toggleCompare(); close.click(); }
            if (k === 'export') { exportData(); close.click(); }
            if (k === 'about') { close.click(); setTimeout(() => route.about(), 240); }
          }));
        }, 40);
      }
    });

    document.addEventListener('keydown', (e) => {
      const t = e.target;
      const typing = t && (t.tagName === 'INPUT' || t.tagName === 'TEXTAREA' || t.tagName === 'SELECT' || t.isContentEditable);
      if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === 'k') { e.preventDefault(); openPalette(); return; }
      if (typing) return;
      if (e.key === '/') { e.preventDefault(); openPalette(); return; }
      if (e.key === '?' ) { e.preventDefault(); shortcutsSheet(); return; }
      const map = { '1': 'overview', '2': 'trends', '3': 'audience', '4': 'performance', '5': 'explore' };
      if (map[e.key]) { route.navigate(map[e.key], { push: true }); return; }
      if (e.key.toLowerCase() === 'c') route.toggleCompare();
      if (e.key.toLowerCase() === 'd') setTheme(resolvedTheme() === 'dark' ? 'light' : 'dark');
      if (e.key.toLowerCase() === 'r') route.refresh();
    });

    window.addEventListener('popstate', () => { route.parse(); route.render(false); });
    window.addEventListener('scroll', () => {
      const t = $('#topbar');
      if (t) t.classList.toggle('scrolled', window.scrollY > 4);
    }, { passive: true });
  }

  function bootShell() {
    document.documentElement.dataset.rail = STATE.rail;
    applyTheme(false);
    route.parse();
    bind();
    route.syncURL(false);
  }

  TEL.ui = {
    $, $$, esc, icon, toast, copy, tip, popover, closePopover, sheet, download,
    toCSV, exportData, openPalette, shortcutsSheet, resolvedTheme, setTheme,
    route, STATE, syncChrome: () => route.updateChrome(),
  };
  TEL.bootShell = bootShell;
})();


/* ==========================================================================
   04 · 共享 UI 组件
   ========================================================================== */
(function () {
  'use strict';
  const TEL = (window.TEL = window.TEL || {});
  const C = TEL.core;
  const esc = (v) => TEL.ui.esc(v);

  function icon(name, cls) { return TEL.ui.icon(name, cls); }

  function head(title, sub, actions, extra) {
    return '<header class="card-head' + (extra ? ' ' + extra : '') + '">'
      + '<div class="ct"><h2>' + title + '</h2>' + (sub ? '<p>' + sub + '</p>' : '') + '</div>'
      + (actions ? '<div class="card-actions">' + actions + '</div>' : '')
      + '</header>';
  }

  function chartCard(o) {
    return '<section class="card chart-card rise ' + (o.cls || '') + '">'
      + head(o.title, o.sub, o.actions)
      + '<div class="card-body">' + o.body + '</div>'
      + (o.foot ? '<footer class="card-foot">' + o.foot + '</footer>' : '')
      + '</section>';
  }

  function seg(name, options, current, cls) {
    return '<div class="seg ' + (cls || '') + '" data-seg="' + name + '" role="group">'
      + options.map(([key, label]) =>
        '<button type="button" data-v="' + key + '" class="' + (current === key ? 'on' : '') + '" aria-pressed="' + (current === key) + '">' + label + '</button>'
      ).join('') + '</div>';
  }

  function legend(series) {
    return '<div class="legend">' + series.map((s) =>
      '<span class="lg"><i style="background:' + (s.color || 'var(--chart-1)') + '"></i>' + esc(s.name) + '</span>'
    ).join('') + '</div>';
  }

  function deltaChip(value, opts) {
    const o = opts || {};
    if (value === null || value === undefined || !Number.isFinite(value)) {
      return '<span class="delta flat">—</span>';
    }
    const up = value >= 0;
    const tone = o.invert ? (up ? 'down' : 'up') : (up ? 'up' : 'down');
    return '<span class="delta ' + tone + '">' + icon(up ? 'arrow-up' : 'arrow-down') + C.fmtSignedPct(value) + '</span>';
  }

  function kpiCard(k) {
    return '<article class="card kpi rise" data-kpi="' + k.key + '">'
      + '<div class="kpi-top"><span class="kpi-label"><i class="kdot" style="background:var(' + k.color + ')"></i>' + esc(k.label) + '</span>'
      + '<span class="kpi-hint">' + esc(k.hint) + '</span></div>'
      + '<div class="kpi-value count" data-val="' + k.value + '" data-format="' + (k.key === 'duration' ? 'hours' : 'int') + '">' + esc(k.display) + '</div>'
      + '<div class="kpi-foot"><div class="kpi-delta">' + (k.delta === null || k.delta === undefined
        ? '<span class="delta flat">首期</span><span class="muted" title="对比周期 = 紧邻当前时间范围之前的等长区间">' + esc(k.prevEmptyText || '无更早数据') + '</span>'
        : deltaChip(k.delta) + '<span class="muted" title="与紧邻当前时间范围之前的等长区间比较">' + esc(k.compareText) + '</span>') + '</div>'
      + '<div class="spark" data-values="' + esc(JSON.stringify(k.spark)) + '" data-color="' + k.color + '"></div></div>'
      + '</article>';
  }

  function rankList(items, opts) {
    const o = opts || {};
    const max = o.max || Math.max(1, ...items.map((x) => x.value));
    return '<div class="rank-list' + (o.compact ? ' compact' : '') + '">' + items.map((item, i) => {
      const pct = o.showShare && item.total ? item.value / item.total : null;
      return '<div class="rank-row" style="--i:' + i + '">'
        + '<div class="rank-head"><span class="rank-label" title="' + esc(item.label) + '">' + esc(item.label) + (item.tag ? '<em>' + esc(item.tag) + '</em>' : '') + '</span>'
        + '<span class="rank-value">' + esc(item.display || C.fmtInt(item.value))
        + (pct !== null ? '<em>' + C.fmtPct(pct) + '</em>' : '') + '</span></div>'
        + '<div class="rank-track"><i class="rank-fill" style="--w:' + Math.max(1.5, (item.value / max) * 100).toFixed(2) + '%;--c:' + (item.color || 'var(--accent)') + '"></i></div>'
        + '</div>';
    }).join('') + '</div>';
  }

  function donutLegend(items, total) {
    return '<div class="donut-legend">' + items.map((x, i) =>
      '<div class="dl-row"><i class="sw" style="background:' + (x.color || 'var(--chart-' + ((i % 8) + 1) + ')') + '"></i>'
      + '<span class="dl-label">' + esc(x.label) + '</span><span class="dl-val">' + C.fmtPct(x.value / total) + '</span></div>'
    ).join('') + '</div>';
  }

  function tableHTML(cols, rows, opts) {
    const o = opts || {};
    return '<div class="table-wrap' + (o.maxHeight ? ' scroll' : '') + '"' + (o.maxHeight ? ' style="max-height:' + o.maxHeight + '"' : '') + '>'
      + '<table class="dt"><thead><tr>' + cols.map((c) =>
        '<th class="' + (c.align || 'left') + '">' + (c.sort ? '<button data-sort="' + c.sort + '">' + esc(c.label) + '</button>' : esc(c.label)) + '</th>'
      ).join('') + '</tr></thead><tbody>'
      + rows.map((r) => '<tr>' + cols.map((c) => '<td class="' + (c.align || 'left') + '">' + (c.render ? c.render(r) : esc(r[c.key])) + '</td>').join('') + '</tr>').join('')
      + '</tbody></table></div>';
  }

  function empty(text, sub) {
    return '<div class="empty"><span class="empty-ic">' + icon('inbox') + '</span><b>' + esc(text || '暂无数据') + '</b>'
      + (sub ? '<p>' + esc(sub) + '</p>' : '') + '</div>';
  }

  function countUp(node, value, format) {
    if (TEL.charts.reduceMotion) { node.textContent = format(value); return; }
    const dur = 760;
    const start = performance.now();
    function frame(now) {
      const p = Math.min(1, (now - start) / dur);
      const e = 1 - Math.pow(1 - p, 3);
      node.textContent = format(value * e);
      if (p < 1) requestAnimationFrame(frame);
      else node.textContent = format(value);
    }
    requestAnimationFrame(frame);
  }

  function initCommon(root) {
    root.querySelectorAll('.count').forEach((node) => {
      const value = Number(node.getAttribute('data-val'));
      if (!Number.isFinite(value)) return;
      const kind = node.getAttribute('data-format');
      if (kind === 'hours') countUp(node, value, (v) => C.fmtHours(v));
      else if (kind === 'pct') countUp(node, value, (v) => C.fmtPct(v / 100, 1));
      else countUp(node, value, (v) => C.fmtInt(v));
    });
    root.querySelectorAll('.spark[data-values]').forEach((node) => {
      let values = [];
      try { values = JSON.parse(node.getAttribute('data-values') || '[]'); } catch (e) {}
      TEL.charts.spark(node, values, node.getAttribute('data-color') || '--chart-1');
    });
  }

  /* 卡片菜单里的「数据表」切换：把当前图表的序列转成可读表格 */
  function seriesTable(labels, series, opts) {
    const o = opts || {};
    const cols = [{ key: 'label', label: o.label || '时间' }].concat(series.map((s) => ({ key: s.name, label: s.name, align: 'right' })));
    const rows = labels.map((label, i) => {
      const row = { label: o.formatLabel ? o.formatLabel(label) : label };
      series.forEach((s) => { row[s.name] = s.values[i] === null || s.values[i] === undefined ? '—' : (s.fmt ? s.fmt(s.values[i]) : C.fmtInt(s.values[i])); });
      return row;
    });
    return tableHTML(cols, rows, { maxHeight: o.maxHeight || '320px' });
  }

  /* 版本号降序：取标签里的数字段逐个比较，没有数字的（未知 / 其他）恒排末位 */
  function versionParts(label) {
    const m = String(label == null ? '' : label).match(/(\d+(?:\.\d+)*)/);
    return m ? m[1].split('.').map(Number) : null;
  }
  function byVersionDesc(a, b) {
    const pa = versionParts(a.label);
    const pb = versionParts(b.label);
    if (!pa && !pb) return 0;
    if (!pa) return 1;
    if (!pb) return -1;
    for (let i = 0; i < Math.max(pa.length, pb.length); i++) {
      const d = (pb[i] || 0) - (pa[i] || 0);
      if (d) return d;
    }
    return 0;
  }
  function sortVersionItems(items) {
    return items.slice().sort(byVersionDesc);
  }

  TEL.comp = {
    head, chartCard, seg, legend, deltaChip, kpiCard, rankList, donutLegend,
    tableHTML, empty, initCommon, seriesTable, sortVersionItems, byVersionDesc,
  };
})();

(function () {
  'use strict';
  const TEL = window.TEL;
  const C = TEL.core;
  const S = TEL.comp;
  const U = TEL.ui;
  const state = C.state;

  function mainSeries(metric) {
    const cur = C.series(metric, state.range);
    const prev = C.series(metric, C.shiftRange(state.range));
    const m = C.METRICS[metric];
    const out = [{
      name: m.label, values: cur, color: m.color, type: state.chart.type === 'bar' ? 'bar' : state.chart.type,
      width: 2.2,
    }];
    if (state.compare && prev.length) {
      out.push({ name: '上一周期', values: prev, color: m.color, dashed: true, type: 'line' });
    }
    return out;
  }

  function paintChart(root) {
    const metric = state.chart.metrics[0] || 'users';
    const m = C.METRICS[metric];
    const host = root.querySelector('#ovChart');
    if (!host) return;
    const days = C.daysIn(state.range);
    const labels = days.map((d) => d.day);
    const series = mainSeries(metric);
    const fmtY = metric === 'duration' ? (v) => (v >= 100 ? C.fmtInt(v) : Number(v).toFixed(1)) : null;
    TEL.charts.trend(host, {
      labels,
      series,
      type: state.chart.type === 'bar' ? 'bar' : state.chart.type,
      smooth: state.chart.smooth,
      dots: state.chart.dots,
      yFormat: fmtY || undefined,
      xFormat: C.fmtShort,
      tipFormat: C.fmtDate,
      aria: m.label + '趋势，' + C.rangeSub(state.range),
    });
    const legend = root.querySelector('#ovLegend');
    if (legend) {
      legend.innerHTML = S.legend(series.map((s) => ({ name: s.name, color: s.color })));
    }
    const table = root.querySelector('#ovTable');
    if (table) {
      table.innerHTML = S.seriesTable(labels, series.map((s) => Object.assign({}, s, {
        fmt: metric === 'duration' ? (v) => C.fmtHours(v) : C.fmtInt,
      })), { label: '日期' });
    }
  }

  function heat(root) {
    const hours = C.hourOfDay(state.range);
    const max = Math.max(...hours.map((h) => h.devices));
    const peak = hours.slice().sort((a, b) => b.devices - a.devices)[0];
    const box = root.querySelector('#heat');
    if (!box) return;
    box.innerHTML = hours.map((h) => {
      const x = h.devices / max;
      return '<button class="heat-cell' + (h.hour === peak.hour ? ' peak' : '') + '" data-hour="' + h.hour + '" style="--o:' + (0.045 + Math.pow(x, 1.45) * 0.9).toFixed(3) + '" aria-label="' + String(h.hour).padStart(2, '0') + ' 时，' + C.fmtInt(h.devices) + ' 台设备">'
        + '<i></i><span>' + (h.hour % 6 === 0 ? String(h.hour).padStart(2, '0') : '') + '</span></button>';
    }).join('');
    const peakLabel = root.querySelector('#peakLabel');
    if (peakLabel) peakLabel.textContent = String(peak.hour).padStart(2, '0') + ':00 – ' + String(peak.hour).padStart(2, '0') + ':59';
    const peakShare = root.querySelector('#peakShare');
    if (peakShare) peakShare.textContent = C.fmtPct(peak.share);
    const evening = hours.filter((h) => h.hour >= 18).reduce((s, h) => s + h.share, 0);
    const eveningEl = root.querySelector('#eveningShare');
    if (eveningEl) eveningEl.textContent = C.fmtPct(evening, 0);
    const night = hours.filter((h) => h.hour < 6).reduce((s, h) => s + h.share, 0);
    const nightEl = root.querySelector('#nightShare');
    if (nightEl) nightEl.textContent = C.fmtPct(night, 1);

    box.querySelectorAll('[data-hour]').forEach((cell) => {
      let cellTouch = false;
      cell.addEventListener('pointerenter', (e) => {
        cellTouch = e.pointerType === 'touch';
        const h = hours[Number(cell.getAttribute('data-hour'))];
        U.tip.show('<div class="tip-h">' + String(h.hour).padStart(2, '0') + ':00 – ' + String(h.hour).padStart(2, '0') + ':59</div>'
          + '<div class="tip-row"><i style="background:var(--accent)"></i><span>活跃设备</span><b>' + C.fmtInt(h.devices) + '</b></div>'
          + '<div class="tip-row"><i style="background:var(--chart-2)"></i><span>打开次数</span><b>' + C.fmtInt(h.opens) + '</b></div>'
          + '<div class="tip-row"><i style="background:transparent"></i><span>时段占比</span><b>' + C.fmtPct(h.share) + '</b></div>', e.clientX, e.clientY, cellTouch ? { touch: true } : null);
      });
      cell.addEventListener('pointermove', (e) => U.tip.move(e.clientX, e.clientY));
      cell.addEventListener('pointerleave', () => {
        if (cellTouch) U.tip.hideSoon(1500);
        else U.tip.hide();
      });
    });
  }

  function todayChart(root) {
    const host = root.querySelector('#todayChart');
    if (!host) return;
    const day = C.END;
    const rows = TEL.data.hourly.filter((r) => r.day === day);
    TEL.charts.trend(host, {
      labels: rows.map((r) => String(r.h).padStart(2, '0')),
      series: [{ name: '活跃设备', values: rows.map((r) => r.devices), color: '--chart-1', type: 'area', areaOpacity: 0.16 }],
      type: 'area',
      smooth: true,
      yFormat: (v) => C.fmtCompact(v),
      xFormat: (v) => v + ':00',
      tipFormat: (v) => '今日 ' + v + ':00',
      aria: '今日 24 小时活跃设备',
    });
  }

  function page(root) {
    const kpis = C.kpis(state.range);
    const life = C.lifetime();
    const today = C.today();
    const yest = TEL.data.days[TEL.data.days.length - 2];
    const todayPeak = TEL.data.hourly.filter((r) => r.day === C.END).slice().sort((a, b) => b.devices - a.devices)[0];
    const pages = C.pagesIn(state.range);
    const totalOpens = C.sum(pages, (p) => p.count);
    const hours = C.hourOfDay(state.range);
    const peak = hours.slice().sort((a, b) => b.devices - a.devices)[0];
    const insights = C.insights(state.range);
    const topPages = pages.slice(0, 5);
    const other = pages.slice(5).reduce((s, p) => s + p.count, 0);
    const rankItems = topPages.map((p) => ({
      label: p.label, value: p.count, display: C.fmtInt(p.count), total: totalOpens,
      color: 'var(' + p.color + ')', tag: p.delta === null ? '' : C.fmtSignedPct(p.delta),
    }));
    if (other) rankItems.push({ label: '其他 3 个页面', value: other, display: C.fmtInt(other), total: totalOpens, color: 'var(--chart-8)' });

    const donutItems = pages.map((p) => ({ label: p.label, value: p.count, color: 'var(' + p.color + ')' }));

    root.innerHTML = '<div class="stack">'

      /* 洞察 */
      + '<section class="insight-rail rise" aria-label="本期要点">'
      + insights.map((ins) => '<div class="insight ' + (ins.tone || '') + '"><span class="ins-ic">' + U.icon(ins.icon) + '</span><p>' + ins.html + '</p></div>').join('')
      + '</section>'

/* ==========================================================================
   06 · 趋势
   ========================================================================== */
(function () {
  'use strict';
  const TEL = window.TEL;
  const C = TEL.core;
  const S = TEL.comp;
  const U = TEL.ui;
  const state = C.state;

  let pageSort = 'count';

  function selectedMetrics() {
    const list = state.chart.metrics.filter((m) => C.METRICS[m]);
    return list.length ? list : ['users'];
  }

  function mixedUnits(metrics) {
    const units = new Set(metrics.map((m) => C.METRICS[m].unit));
    return units.size > 1;
  }

  function indexed() {
    return selectedMetrics().length > 1 && (state.chart.index || mixedUnits(selectedMetrics()));
  }

  function valuesFor(metric, labels, granularity) {
    if (granularity === 'hour') {
      const h = C.hourlySeries(metric, state.range);
      return { labels: h.labels, values: h.values };
    }
    return { labels: C.daysIn(state.range).map((d) => d.day), values: C.series(metric, state.range) };
  }

  function prevValuesFor(metric, granularity) {
    const prev = C.shiftRange(state.range);
    if (granularity === 'hour') {
      const h = C.hourlySeries(metric, prev);
      return h.values;
    }
    return C.series(metric, prev);
  }

  function rebase(values) {
    let base = 0;
    for (const v of values) { if (Number(v) > 0) { base = Number(v); break; } }
    if (!base) return values.map(() => 100);
    return values.map((v) => Math.round((Number(v) / base) * 1000) / 10);
  }

  function metricFmt(metric) {
    const m = C.METRICS[metric];
    if (metric === 'duration') return (v) => C.fmtHours(v);
    return m.fmt;
  }

  function chartConfig() {
    const metrics = selectedMetrics();
    const gran = state.granularity;
    const idx = indexed();
    const first = valuesFor(metrics[0], [], gran);
    const labels = first.labels;
    const series = metrics.map((key) => {
      const m = C.METRICS[key];
      const d = valuesFor(key, [], gran);
      return {
        name: m.label,
        values: idx ? rebase(d.values) : d.values,
        color: m.color,
        type: state.chart.type === 'bar' ? 'bar' : state.chart.type,
        width: 2.2,
        fmt: idx ? (v) => '指数 ' + Number(v).toFixed(1) : metricFmt(key),
      };
    });
    if (state.compare && metrics.length === 1 && gran === 'day') {
      const prev = prevValuesFor(metrics[0], 'day');
      series.push({
        name: '上一周期',
        values: idx ? rebase(prev) : prev,
        color: C.METRICS[metrics[0]].color,
        dashed: true,
        type: 'line',
      });
    }
    return { metrics, labels, series, idx, gran };
  }

  /* 小时粒度：X 轴按「天」对齐取刻度，避免机械抽样落在随机小时上 */
  function hourTicks(labels) {
    const firstOfDay = [];
    let prev = '';
    labels.forEach((l, i) => {
      const day = String(l).slice(0, 10);
      if (day !== prev) { firstOfDay.push(i); prev = day; }
    });
    if (firstOfDay.length <= 7) return firstOfDay;
    const step = Math.ceil(firstOfDay.length / 6);
    const out = [];
    for (let i = 0; i < firstOfDay.length; i += step) out.push(firstOfDay[i]);
    const last = firstOfDay[firstOfDay.length - 1];
    if (out[out.length - 1] !== last && labels.length - 1 - out[out.length - 1] > step * 18) out.push(last);
    return out;
  }

  function paintChart(root) {
    const cfg = chartConfig();
    const host = root.querySelector('#trChart');
    if (!host) return;
    const isHour = cfg.gran === 'hour';
    const fmtAxis = cfg.idx ? (v) => Math.round(v) : (isHour
      ? (v) => C.fmtCompact(v)
      : (v) => (cfg.metrics[0] === 'duration' ? C.fmtHours(v) : C.fmtCompact(v)));
    TEL.charts.trend(host, {
      labels: cfg.labels,
      series: cfg.series,
      type: state.chart.type === 'bar' ? 'bar' : state.chart.type,
      smooth: state.chart.smooth,
      dots: state.chart.dots,
      yFormat: fmtAxis,
      xTicks: isHour ? hourTicks(cfg.labels) : null,
      xFormat: isHour
        ? (v) => C.fmtShort(String(v).slice(0, 10))
        : C.fmtShort,
      tipFormat: isHour ? C.fmtHour : C.fmtDate,
      aria: cfg.metrics.map((m) => C.METRICS[m].label).join('、') + '趋势',
    });
    const legend = root.querySelector('#trLegend');
    if (legend) legend.innerHTML = S.legend(cfg.series.map((s) => ({ name: s.name, color: s.color })));
    const table = root.querySelector('#trTable');
    if (table) {
      table.innerHTML = S.seriesTable(cfg.labels, cfg.series, {
        label: isHour ? '小时（北京时间）' : '日期',
        formatLabel: isHour ? C.fmtHour : null,
      });
    }
    const note = root.querySelector('#trNote');
    if (note) {
      note.textContent = cfg.metrics.length > 1
        ? (cfg.idx ? '多指标已指数化，比较的是变化幅度而非绝对值' : '多指标同单位，按原始值叠加')
        : (state.compare ? '虚线为上一周期 ' + C.rangeSub(C.shiftRange(state.range)) : '对比已关闭');
    }
  }

  function paintReadout(root) {
    const box = root.querySelector('#trReadout');
    if (!box) return;
    const metrics = selectedMetrics();
    const isHour = state.granularity === 'hour';
    const curRows = C.daysIn(state.range);
    const prevRows = C.prevDaysIn(state.range);
    box.innerHTML = metrics.map((key) => {
      const m = C.METRICS[key];
      const cur = C.metricValue(key, curRows);
      const prev = C.metricValue(key, prevRows);
      return '<div class="ro"><i class="dot" style="background:var(' + m.color + ')"></i>'
        + '<span class="ro-label">' + m.label + (isHour ? '<em>日均</em>' : '') + '</span>'
        + '<b>' + m.fmt(cur) + '</b>'
        + S.deltaChip(C.delta(cur, prev))
        + '</div>';
    }).join('');
  }

  function paintToolbar(root) {
    root.querySelectorAll('[data-seg="trGran"] button').forEach((b) => {
      const on = b.getAttribute('data-v') === state.granularity;
      b.classList.toggle('on', on);
      b.setAttribute('aria-pressed', String(on));
    });
    root.querySelectorAll('[data-seg="trType"] button').forEach((b) => {
      const on = b.getAttribute('data-v') === state.chart.type;
      b.classList.toggle('on', on);
      b.setAttribute('aria-pressed', String(on));
    });
    root.querySelectorAll('[data-metric]').forEach((b) => {
      const on = selectedMetrics().indexOf(b.getAttribute('data-metric')) >= 0;
      b.classList.toggle('on', on);
      b.setAttribute('aria-pressed', String(on));
    });
    const idxHint = root.querySelector('#idxHint');
    if (idxHint) idxHint.hidden = !indexed();
  }

  function refresh(root) {
    paintReadout(root);
    paintToolbar(root);
    paintChart(root);
  }

  function toggleMetric(key, root) {
    const list = selectedMetrics().slice();
    const at = list.indexOf(key);
    if (at >= 0) {
      if (list.length === 1) { U.toast('至少保留一个指标', 'warn'); return; }
      list.splice(at, 1);
    } else {
      if (list.length >= 3) { U.toast('最多同时对比 3 个指标', 'warn'); return; }
      list.push(key);
    }
    state.chart.metrics = list;
    state.chart.index = mixedUnits(list);
    C.saveStore();
    U.route.syncURL(false);
    refresh(root);
  }

  function openSettings(root) {
    const metrics = selectedMetrics();
    const mixed = mixedUnits(metrics);
    const body = '<div class="setting-group"><div class="sg-head"><b>指标</b><span>最多 3 个</span></div>'
      + '<div class="mchips wrap" id="setMetrics">' + C.METRIC_ORDER.map((key) => {
        const m = C.METRICS[key];
        return '<button class="mchip' + (metrics.indexOf(key) >= 0 ? ' on' : '') + '" data-sm="' + key + '"><i style="background:var(' + m.color + ')"></i>' + m.label + '</button>';
      }).join('') + '</div></div>'
      + '<div class="setting-group"><div class="sg-head"><b>图表形态</b></div>' + S.seg('setType', [['area', '面积'], ['line', '折线'], ['bar', '柱状']], state.chart.type) + '</div>'
      + '<div class="setting-group">'
      + '<div class="switch-row"><div><b>平滑曲线</b><small>更适合展示趋势，不改变数值</small></div><label class="switch"><input type="checkbox" id="setSmooth"' + (state.chart.smooth ? ' checked' : '') + '><i></i></label></div>'
      + '<div class="switch-row"><div><b>显示数据点</b><small>点数较多时自动缩小</small></div><label class="switch"><input type="checkbox" id="setDots"' + (state.chart.dots ? ' checked' : '') + '><i></i></label></div>'
      + '<div class="switch-row"><div><b>对比上一周期</b><small>仅单指标、按天时叠加虚线</small></div><label class="switch"><input type="checkbox" id="setCompare"' + (state.compare ? ' checked' : '') + '><i></i></label></div>'
      + '<div class="switch-row"><div><b>指数化对比</b><small>' + (mixed ? '单位不同，已自动开启' : '把各指标首值设为 100') + '</small></div><label class="switch"><input type="checkbox" id="setIndex"' + (indexed() ? ' checked' : '') + (mixed ? ' disabled' : '') + '><i></i></label></div>'
      + '</div>'
      + '<div class="setting-note">' + U.icon('info') + '<span>设置会保存在本机，并写入当前视图链接。</span></div>';

    const s = U.sheet({
      title: '图表设置',
      sub: '改动即时生效',
      body,
      foot: '<button class="btn ghost" data-reset>恢复默认</button><button class="btn primary" data-done>完成</button>',
    });
    const panel = s.panel;

    panel.querySelectorAll('[data-sm]').forEach((b) => b.addEventListener('click', () => {
      toggleMetric(b.getAttribute('data-sm'), root);
      panel.querySelectorAll('[data-sm]').forEach((x) => {
        const on = selectedMetrics().indexOf(x.getAttribute('data-sm')) >= 0;
        x.classList.toggle('on', on);
      });
    }));
    panel.querySelectorAll('[data-seg="setType"] button').forEach((b) => b.addEventListener('click', () => {
      state.chart.type = b.getAttribute('data-v');
      panel.querySelectorAll('[data-seg="setType"] button').forEach((x) => x.classList.toggle('on', x === b));
      C.saveStore(); U.route.syncURL(false); refresh(root);
    }));
    panel.querySelector('#setSmooth').addEventListener('change', (e) => {
      state.chart.smooth = e.target.checked; C.saveStore(); U.route.syncURL(false); refresh(root);
    });
    panel.querySelector('#setDots').addEventListener('change', (e) => {
      state.chart.dots = e.target.checked; C.saveStore(); U.route.syncURL(false); refresh(root);
    });
    panel.querySelector('#setCompare').addEventListener('change', (e) => {
      state.compare = e.target.checked; C.saveStore(); U.route.syncURL(false); U.route.updateChrome(); refresh(root);
    });
    panel.querySelector('#setIndex').addEventListener('change', (e) => {
      state.chart.index = e.target.checked; C.saveStore(); U.route.syncURL(false); refresh(root);
    });
    panel.querySelector('[data-reset]').addEventListener('click', () => {
      state.chart = { metrics: ['users'], type: 'area', smooth: true, dots: false };
      state.compare = true;
      C.saveStore(); U.route.syncURL(false); U.route.updateChrome();
      panel.querySelectorAll('[data-sm]').forEach((x) => x.classList.toggle('on', x.getAttribute('data-sm') === 'users'));
      panel.querySelectorAll('[data-seg="setType"] button').forEach((x) => x.classList.toggle('on', x.getAttribute('data-v') === 'area'));

      panel.querySelector('#setDots').checked = false;
      panel.querySelector('#setCompare').checked = true;
      panel.querySelector('#setIndex').checked = false;
      refresh(root);
      U.toast('已恢复默认图表设置', 'ok');
    });
    panel.querySelector('[data-done]').addEventListener('click', () => s.close());
  }

  function pageRows() {
    const pages = C.pagesIn(state.range).slice();
    if (pageSort === 'delta') pages.sort((a, b) => (b.delta === null ? -1e9 : b.delta) - (a.delta === null ? -1e9 : a.delta));
    return pages;
  }

  function paintPageTable(root) {
    const host = root.querySelector('#pageTable');
    if (!host) return;
    const rows = pageRows();
    host.innerHTML = rows.map((p) => {
      const spark = C.pageSpark(p.key, state.range);
      return '<button class="prow" data-page="' + p.key + '" type="button">'
        + '<span class="pname"><i style="background:var(' + p.color + ')"></i>' + p.label + '</span>'
        + '<span class="pnum">' + C.fmtInt(p.count) + '</span>'
        + '<span class="pshare"><i><b style="width:' + Math.max(2, p.share * 100).toFixed(1) + '%;background:var(' + p.color + ')"></b></i><em>' + C.fmtPct(p.share) + '</em></span>'
        + '<span class="pspark" data-values="' + U.esc(JSON.stringify(spark)) + '"></span>'
        + '<span class="pdelta">' + S.deltaChip(p.delta) + '</span>'
        + '<span class="pgo">' + U.icon('chevron-right') + '</span>'
        + '</button>';
    }).join('');
    host.querySelectorAll('.pspark').forEach((node) => {
      let values = [];
      try { values = JSON.parse(node.getAttribute('data-values') || '[]'); } catch (e) {}
      TEL.charts.spark(node, values, '--chart-2');
    });
    host.querySelectorAll('[data-page]').forEach((row) => {
      row.addEventListener('click', () => pageDetail(row.getAttribute('data-page'), root));
    });
    root.querySelectorAll('[data-seg="pageSort"] button').forEach((b) => {
      b.classList.toggle('on', b.getAttribute('data-v') === pageSort);
    });
  }

  function pageDetail(key, root) {
    const labels = C.PAGE_LABELS[key];
    const pages = C.pagesIn(state.range);
    const p = pages.find((x) => x.key === key);
    const values = C.daysIn(state.range).map((d) => d.pages[key]);
    const body = '<div class="detail-stats">'
      + '<div><span>打开次数</span><b>' + C.fmtInt(p.count) + '</b></div>'
      + '<div><span>占比</span><b>' + C.fmtPct(p.share) + '</b></div>'
      + '<div><span>环比</span><b>' + (p.delta === null ? '—' : C.fmtSignedPct(p.delta)) + '</b></div>'
      + '</div><div class="chart-host" id="detailChart" style="height:220px"></div>'
      + '<div class="setting-note">' + U.icon('info') + '<span>按天打开次数 · ' + U.esc(C.rangeSub(state.range)) + '</span></div>';
    U.sheet({ title: labels, sub: '页面使用详情', body });
    requestAnimationFrame(() => {
      const host = document.getElementById('detailChart');
      if (!host) return;
      TEL.charts.trend(host, {
        labels: C.daysIn(state.range).map((d) => d.day),
        series: [{ name: labels, values, color: p.color, type: 'area', width: 2 }],
        type: 'area', smooth: true,
        yFormat: (v) => C.fmtCompact(v), xFormat: C.fmtShort, tipFormat: C.fmtDate,
        fmt: C.fmtInt,
        aria: labels + '打开次数趋势',
      });
    });
  }

  function paintHours(root) {
    const host = root.querySelector('#hourChart');
    if (!host) return;
    const hours = C.hourOfDay(state.range);
    TEL.charts.trend(host, {
      labels: hours.map((h) => String(h.hour).padStart(2, '0')),
      series: [
        { name: '活跃设备', values: hours.map((h) => h.devices), color: '--chart-1', type: 'bar' },
        { name: '累计占比', values: hours.map((h) => Math.round(h.cumulativeShare * 1000) / 10), color: '--chart-2', type: 'line', axis: 1 },
      ],
      type: 'bar',
      yFormat: (v) => C.fmtCompact(v),
      y2Format: (v) => Math.round(v) + '%',
      y2Max: 100,
      xFormat: (v) => v + ' 时',
      tipFormat: (v) => String(v).padStart(2, '0') + ':00 – ' + String(v).padStart(2, '0') + ':59',
      aria: '24 小时活跃分布与累计占比',
    });
    const peak = hours.slice().sort((a, b) => b.devices - a.devices)[0];
    const evening = hours.filter((h) => h.hour >= 18).reduce((s, h) => s + h.share, 0);
    const el = root.querySelector('#hourFoot');
    if (el) el.textContent = '高峰 ' + String(peak.hour).padStart(2, '0') + ':00，占 ' + C.fmtPct(peak.share) + '；18 时后累计 ' + C.fmtPct(evening, 0);
  }

  function page(root) {
    const metrics = selectedMetrics();
    const granOk = C.canHour(state.range);
    const granWhy = C.rangeDays(state.range) > 32 ? '小时粒度最多覆盖 32 天' : '该范围早于小时级数据（仅保留最近 46 天）';
    const hours = C.hourOfDay(state.range);
    const peak = hours.slice().sort((a, b) => b.devices - a.devices)[0];

    root.innerHTML = '<div class="stack">'
      + '<section class="card studio rise">'
      + S.head('趋势分析', '选择指标、粒度与形态，图表会即时重算',
        '<button class="btn ghost sm" data-act="tr-settings">' + U.icon('sliders') + '图表设置</button>'
        + '<button class="icon-btn" data-act="tr-table" aria-label="数据表" title="数据表">' + U.icon('table') + '</button>')
      + '<div class="studio-bar">'
      + '<div class="mchips" id="trMetrics">' + C.METRIC_ORDER.map((key) => {
        const m = C.METRICS[key];
        return '<button class="mchip' + (metrics.indexOf(key) >= 0 ? ' on' : '') + '" data-metric="' + key + '"><i style="background:var(' + m.color + ')"></i>' + m.label + '</button>';
      }).join('') + '</div>'
      + '<div class="studio-tools">'
      + '<div class="seg" data-seg="trGran" role="group" aria-label="粒度">'
      + '<button data-v="day" class="' + (state.granularity === 'day' ? 'on' : '') + '">按天</button>'
      + '<button data-v="hour" class="' + (state.granularity === 'hour' ? 'on' : '') + (granOk ? '' : ' disabled') + '" title="' + (granOk ? '按小时查看' : granWhy) + '">按小时</button>'
      + '</div>'
      + S.seg('trType', [['area', '面积'], ['line', '折线'], ['bar', '柱状']], state.chart.type, 'hide-sm')
      + '</div></div>'
      + '<div class="readout" id="trReadout"></div>'
      + '<div class="card-body studio-body"><div class="chart-host" id="trChart" style="height:330px"></div>'
      + '<div class="chart-table" id="trTable" hidden></div></div>'
      + '<footer class="card-foot"><div class="legend-wrap" id="trLegend"></div><span class="foot-note" id="trNote"></span></footer>'
      + '</section>'

      + '<div class="grid split">'
      + '<section class="card rise">'
      + S.head('页面表现', '按打开次数 · 点击行查看单页趋势',
        S.seg('pageSort', [['count', '按打开'], ['delta', '按环比']], pageSort))
      + '<div class="card-body flush"><div class="ptable-head"><span>页面</span><span>打开</span><span>占比</span><span>走势</span><span>环比</span><span></span></div>'
      + '<div class="ptable" id="pageTable"></div></div>'
      + '</section>'

      + '<section class="card rise">'
      + S.head('时段分布', '0–24 时 · ' + C.hourWindow(state.range) + ' · 柱为设备数，线为累计占比')
      + '<div class="card-body"><div class="chart-host" id="hourChart" style="height:252px"></div></div>'
      + '<footer class="card-foot"><span class="foot-note" id="hourFoot">高峰 ' + String(peak.hour).padStart(2, '0') + ':00</span></footer>'
      + '</section>'
      + '</div>'
      + '</div>';

    paintReadout(root);
    paintChart(root);
    paintPageTable(root);
    paintHours(root);

    root.querySelectorAll('[data-metric]').forEach((b) => {
      b.addEventListener('click', () => toggleMetric(b.getAttribute('data-metric'), root));
    });
    root.querySelectorAll('[data-seg="trGran"] button').forEach((b) => {
      b.addEventListener('click', () => {
        if (b.classList.contains('disabled')) {
          U.toast('小时粒度最多查看 32 天，请先缩短范围', 'warn');
          return;
        }
        state.granularity = b.getAttribute('data-v');
        U.route.syncURL(false);
        refresh(root);
      });
    });
    root.querySelectorAll('[data-seg="trType"] button').forEach((b) => {
      b.addEventListener('click', () => {
        state.chart.type = b.getAttribute('data-v');
        C.saveStore(); U.route.syncURL(false);
        refresh(root);
      });
    });
    root.querySelectorAll('[data-seg="pageSort"] button').forEach((b) => {
      b.addEventListener('click', () => {
        pageSort = b.getAttribute('data-v');
        paintPageTable(root);
      });
    });
    root.querySelector('[data-act="tr-settings"]').addEventListener('click', () => openSettings(root));
    root.querySelector('[data-act="tr-table"]').addEventListener('click', (e) => {
      const host = root.querySelector('#trChart');
      const table = root.querySelector('#trTable');
      const on = table.hidden;
      table.hidden = !on;
      host.style.display = on ? 'none' : '';
      e.currentTarget.classList.toggle('active', on);
    });
    S.initCommon(root);
  }

  TEL.pages = TEL.pages || {};
  TEL.pages.trends = page;
})();


/* ==========================================================================
   07 · 用户
   ========================================================================== */
(function () {
  'use strict';
  const TEL = window.TEL;
  const C = TEL.core;
  const S = TEL.comp;
  const U = TEL.ui;
  const state = C.state;

  const TABS = [['device', '设备与环境'], ['software', '软件版本'], ['depth', '使用深度']];

  function statBand() {
    const life = C.lifetime();
    const dark = TEL.data.env.dark.find((x) => x.label === '深色偏好');
    const touch = TEL.data.env.touch.find((x) => /触屏/.test(x.label));
    const users = TEL.data.meta.users;
    return '<section class="card stat-band rise">'
      + '<div class="sb"><span>设备总数</span><b>' + C.fmtInt(users) + '</b><em>累计去重</em></div>'
      + '<div class="sb"><span>深色偏好</span><b>' + C.fmtPct((dark ? dark.count : 0) / users) + '</b><em>系统级偏好</em></div>'
      + '<div class="sb"><span>触屏 / 粗指针</span><b>' + C.fmtPct((touch ? touch.count : 0) / users) + '</b><em>移动端体验</em></div>'
      + '<div class="sb"><span>关闭匿名统计</span><b>' + C.fmtPct(life.disabledRate) + '</b><em>' + C.fmtInt(life.disabledUsers) + ' 台</em></div>'
      + '</section>';
  }

  function dimCard(dim, opts) {
    const o = opts || {};
    const d = C.dimensionItems(dim);
    const total = C.sum(d.items, (x) => x.count);
    let items = d.items.slice(0, o.limit || 8).map((x, i) => ({
      label: x.label, value: x.count, display: C.fmtInt(x.count), total,
      color: o.colors ? o.colors[i % o.colors.length] : (o.color || 'var(--chart-2)'),
      tag: '',
    }));
    if (d.items.length > (o.limit || 8)) {
      const rest = d.items.slice(o.limit || 8).reduce((s, x) => s + x.count, 0);
      items.push({ label: '其他', value: rest, display: C.fmtInt(rest), total, color: 'var(--chart-8)' });
    }
    if (o.byVersion) items = S.sortVersionItems(items);
    return '<section class="card dim-card rise">'
      + S.head(d.label, o.note || ('共 ' + C.fmtInt(total) + ' 台设备'))
      + '<div class="card-body">' + (items.length ? S.rankList(items, { showShare: true, compact: true }) : S.empty()) + '</div>'
      + '</section>';
  }

  function donutBlock(dim, title, colorStart, colorMap) {
    const d = C.dimensionItems(dim);
    const total = C.sum(d.items, (x) => x.count);
    const items = d.items.map((x, i) => ({
      label: x.label, value: x.count,
      color: (colorMap && colorMap[x.label]) || 'var(--chart-' + (((i + (colorStart || 0)) % 8) + 1) + ')',
    }));
    return '<div class="donut-block"><div class="db-head"><h3>' + title + '</h3><span>' + C.fmtInt(total) + ' 台</span></div>'
      + '<div class="chart-host donut-host" id="donut-' + dim + '" style="height:150px"></div>'
      + S.donutLegend(items, total)
      + '</div>';
  }

  function donutItems(dim, start, colorMap) {
    const d = C.dimensionItems(dim);
    return d.items.map((x, i) => ({
      label: x.label, value: x.count,
      color: (colorMap && colorMap[x.label]) || 'var(--chart-' + (((i + (start || 0)) % 8) + 1) + ')',
    }));
  }

  function paintDonuts(root) {
    const maps = {
      dark: { '深色偏好': 'var(--chart-4)', '浅色偏好': 'var(--chart-5)' },
      themeMode: { '深色': 'var(--chart-4)', '浅色': 'var(--chart-5)', '跟随系统': 'var(--chart-2)', '未上报': 'var(--chart-8)' },
    };
    [['os', 0], ['arch', 2], ['dark', 4], ['themeMode', 5]].forEach(([dim, start]) => {
      const host = root.querySelector('#donut-' + dim);
      if (!host) return;
      const items = donutItems(dim, start, maps[dim]);
      const total = C.sum(items, (x) => x.value);
      TEL.charts.donut(host, {
        items,
        value: C.fmtCompact(total),
        label: '台设备',
        aria: (dim === 'os' ? '操作系统' : dim === 'arch' ? 'CPU 架构' : dim === 'dark' ? '系统深浅色' : '扩展颜色模式') + '占比',
      });
    });
  }

  function deviceTab() {
    return '<div class="grid g-2">'
      + '<section class="card rise"><div class="card-body"><div class="donut-pair">'
      + donutBlock('os', '操作系统', 0) + donutBlock('arch', 'CPU 架构', 2)
      + '</div></div></section>'
      + '<section class="card rise"><div class="card-body"><div class="donut-pair">'
      + donutBlock('dark', '系统深浅色', 4, { '深色偏好': 'var(--chart-4)', '浅色偏好': 'var(--chart-5)' })
      + donutBlock('themeMode', '扩展颜色模式', 5, { '深色': 'var(--chart-4)', '浅色': 'var(--chart-5)', '跟随系统': 'var(--chart-2)', '未上报': 'var(--chart-8)' })
      + '</div></div></section>'
      + '</div>'
      + '<div class="masonry">'
      + dimCard('width', { note: '面板宽度分桶 · 每设备最近一次上报', color: 'var(--chart-1)' })
      + dimCard('touch', { note: '输入设备类型', colors: ['var(--chart-4)', 'var(--chart-2)'] })
      + dimCard('standalone', { note: '浏览器内或独立窗口', colors: ['var(--chart-3)', 'var(--chart-5)'] })
      + dimCard('tz', { note: 'UTC 偏移 · 每设备最近一次上报', color: 'var(--chart-2)' })
      + '</div>';
  }

  function softwareTab() {
    const total = TEL.data.meta.users;
    const versions = TEL.data.versions;
    // 最新版 = 版本号最大的一个（不能取用量最多的那个）
    const latest = S.sortVersionItems(versions.filter((v) => /^v\d/.test(v.label)))[0] || null;
    const line = latest ? latest.label.split('.').slice(0, 2).join('.') : '';
    const lineLabel = line ? line.slice(1) + '.x' : '同系列';
    const recent = line ? versions.filter((v) => v.label.indexOf(line + '.') === 0).reduce((s, v) => s + v.count, 0) : 0;
    const recentRest = Math.max(0, recent - (latest ? latest.count : 0));
    const older = Math.max(0, total - recent);
    const outdated = older;
    const numeric = versions.filter((v) => /^v\d/.test(v.label)).slice().sort((a, b) => {
      const pa = a.label.slice(1).split('.').map(Number);
      const pb = b.label.slice(1).split('.').map(Number);
      for (let i = 0; i < Math.max(pa.length, pb.length); i++) {
        const d = (pa[i] || 0) - (pb[i] || 0);
        if (d) return d;
      }
      return 0;
    });
    const oldest = numeric[0];
    // 取用量最多的 9 个做展示，再按版本号降序排列
    const shown = S.sortVersionItems(versions.slice(0, 9));
    const items = shown.map((v, i) => ({
      label: v.label, value: v.count, display: C.fmtInt(v.count), total,
      color: i === 0 ? 'var(--accent)' : i < 3 ? 'var(--chart-2)' : 'var(--chart-8)',
    }));
    return '<div class="grid split">'
      + '<section class="card rise">'
      + S.head('扩展版本分布', '每台设备最近一次上报 · 共 ' + C.fmtInt(total) + ' 台')
      + '<div class="card-body">' + S.rankList(items, { showShare: true }) + '</div>'
      + '<footer class="card-foot"><span class="foot-note">最新版 <b>' + (latest ? latest.label : '—') + '</b> 覆盖 ' + (latest ? C.fmtPct(latest.count / total) : '—') + '；' + lineLabel + ' 合计 ' + C.fmtPct(recent / total) + '</span></footer>'
      + '</section>'
      + '<section class="card rise version-callout">'
      + S.head('版本健康度', '更新覆盖与碎片化')
      + '<div class="card-body">'
      + '<div class="vc-num"><b>' + (latest ? C.fmtPct(latest.count / total, 0) : '—') + '</b><span>设备运行最新版本</span></div>'
      + '<div class="vc-bar">'
      + '<i style="width:' + (latest ? (latest.count / total) * 100 : 0).toFixed(1) + '%;background:var(--accent)"></i>'
      + '<b style="width:' + (recentRest / total) * 100 + '%;background:var(--chart-2)"></b>'
      + '<span style="width:' + (older / total) * 100 + '%;background:var(--surface-3)"></span></div>'
      + '<div class="vc-legend"><span><i style="background:var(--accent)"></i>最新版</span><span><i style="background:var(--chart-2)"></i>' + lineLabel + ' 其他</span><span><i style="background:var(--surface-3)"></i>更早版本</span></div>'
      + '<div class="vc-row"><span>版本碎片</span><b>' + versions.filter((v) => /^v\d/.test(v.label)).length + ' 个版本</b></div>'
      + '<div class="vc-row"><span>最老活跃版本</span><b>' + (oldest ? oldest.label : '—') + '</b></div>'
      + '<div class="vc-row"><span>待升级设备</span><b>' + C.fmtInt(outdated) + ' 台</b></div>'
      + '<div class="vc-row"><span>近两版覆盖</span><b>' + C.fmtPct(recent / total) + '</b></div>'
      + '<div class="vc-note">' + U.icon('info') + '<span>版本越分散，性能与问题定位的成本越高。</span></div>'
      + '</div>'
      + '</section>'
      + '</div>'
      + '<div class="masonry">'
      + dimCard('browser', { note: '浏览器家族 · 每设备最近一次上报', color: 'var(--chart-2)' })
      + dimCard('browserVersion', { note: '浏览器 + 主版本号', color: 'var(--chart-2)', byVersion: true })
      + dimCard('stVersion', { note: 'SillyTavern 前端版本', color: 'var(--chart-4)', byVersion: true })
      + dimCard('ttVersion', { note: '仅 TauriTavern 宿主上报', color: 'var(--chart-1)', limit: 6, byVersion: true })
      + dimCard('lang', { note: '界面语言', color: 'var(--chart-3)', limit: 6 })
      + dimCard('tz', { note: 'UTC 偏移', color: 'var(--chart-6)', limit: 7 })
      + '</div>';
  }

  function depthTab() {
    const hist = TEL.data.historyCount;
    const totalUsers = TEL.data.meta.users;
    const hSum = C.sum(hist, (x) => x.count);
    const hAvg = hSum ? C.sum(hist, (x) => x.count * (x.to === null ? 1200 : (x.from + x.to) / 2)) / hSum : 0;
    const life = C.lifetime();
    const totalMs = C.sum(TEL.data.days, (d) => d.durMs);
    const totalViews = C.sum(TEL.data.days, (d) => d.pageTotal);
    const totalOpens = C.sum(TEL.data.days, (d) => d.opens);
    return '<section class="card stat-band rise compact-band">'
      + '<div class="sb"><span>人均历史条数</span><b>' + C.fmtInt(hAvg) + '</b><em>按分组中值估算</em></div>'
      + '<div class="sb"><span>人均累计时长</span><b>' + C.fmtDuration(life.avgDuration) + '</b><em>全部时间</em></div>'
      + '<div class="sb"><span>人均页面浏览</span><b>' + C.fmtInt(totalViews / Math.max(1, totalUsers)) + '</b><em>累计浏览 ÷ 设备</em></div>'
      + '<div class="sb"><span>单次打开时长</span><b>' + C.fmtDuration(totalOpens ? totalMs / totalOpens : 0) + '</b><em>时长 ÷ 打开次数</em></div>'
      + '</section>'
      + '<div class="grid split">'
      + '<section class="card rise">'
      + S.head('历史记录条数分布', '按 100 条等宽分箱 · 0 条设备已排除')
      + '<div class="card-body"><div class="chart-host" id="historyChart" style="height:292px"></div></div>'
      + '<footer class="card-foot"><span class="foot-note">1–499 每 10 条一组，500–999 每 50 条一组，1000 条以上合并</span></footer>'
      + '</section>'
      + '<section class="card rise">'
      + S.head('累计使用时长分布', '按每台设备的累计会话时长分桶')
      + '<div class="card-body"><div class="chart-host" id="durationChart" style="height:292px"></div></div>'
      + '<footer class="card-foot"><span class="foot-note">未记录 = 客户端未产生可计入的会话时长</span></footer>'
      + '</section>'
      + '</div>';
  }

  function historyBins() {
    const src = TEL.data.historyCount;
    const bins = [];
    for (let start = 0; start < 1000; start += 100) {
      const from = start === 0 ? 1 : start;
      const to = start + 99;
      let count = 0;
      src.forEach((b) => { if (b.from >= from && b.from <= to) count += b.count; });
      bins.push({ label: start === 0 ? '1–99' : from + '–' + to, count });
    }
    const last = src.find((b) => b.to === null);
    bins.push({ label: '1000+', count: last ? last.count : 0 });
    const total = C.sum(bins, (b) => b.count) || 1;
    let acc = 0;
    bins.forEach((b) => { acc += b.count; b.cum = (acc / total) * 100; });
    return bins;
  }

  function paintDepth(root) {
    const hHost = root.querySelector('#historyChart');
    if (hHost) {
      const bins = historyBins();
      TEL.charts.trend(hHost, {
        labels: bins.map((b) => b.label),
        series: [
          { name: '设备数', values: bins.map((b) => b.count), color: '--chart-1', type: 'bar' },
          { name: '累计占比', values: bins.map((b) => Math.round(b.cum * 10) / 10), color: '--chart-2', type: 'line', axis: 1 },
        ],
        type: 'bar',
        yFormat: (v) => C.fmtCompact(v),
        y2Format: (v) => Math.round(v) + '%',
        y2Max: 100,
        xLabelMax: 20,
        xFormat: (v) => v,
        tipFormat: (v) => v + ' 条',
        aria: '历史记录条数分布与累计占比',
      });
    }
    const dHost = root.querySelector('#durationChart');
    if (dHost) {
      const rows = TEL.data.durationHistogram;
      const short = (s) => s.replace('未记录', '未记录').replace('<1 分钟', '<1分').replace('<10 分钟', '<10分').replace('<30 分钟', '<30分').replace('<1 小时', '<1时').replace('<3 小时', '<3时').replace('<10 小时', '<10时').replace('<30 小时', '<30时').replace('≥30 小时', '≥30时');
      TEL.charts.trend(dHost, {
        labels: rows.map((r) => short(r.label)),
        series: [{ name: '设备数', values: rows.map((r) => r.count), color: '--chart-3', type: 'bar' }],
        type: 'bar',
        yFormat: (v) => C.fmtCompact(v),
        xLabelMax: 20,
        xFormat: (v) => v,
        tipFormat: (v, i) => rows[i] ? rows[i].label : v,
        aria: '累计使用时长分布',
      });
    }
  }

  function page(root) {
    const tab = state.audienceTab || 'device';
    root.innerHTML = '<div class="stack">'
      + (tab === 'depth' ? '' : statBand())
      + '<div class="page-tabs rise" role="tablist">' + TABS.map(([key, label]) =>
        '<button role="tab" data-tab="' + key + '" aria-selected="' + (tab === key) + '" class="' + (tab === key ? 'on' : '') + '">' + label + '</button>'
      ).join('') + '</div>'
      + '<div class="tab-panel" id="tabPanel">' + (tab === 'device' ? deviceTab() : tab === 'software' ? softwareTab() : depthTab()) + '</div>'
      + '</div>';

    root.querySelectorAll('[data-tab]').forEach((b) => b.addEventListener('click', () => {
      state.audienceTab = b.getAttribute('data-tab');
      U.route.syncURL(false);
      U.route.render(true);
    }));

    if (tab === 'device') paintDonuts(root);
    if (tab === 'depth') paintDepth(root);
    S.initCommon(root);
  }

  TEL.pages = TEL.pages || {};
  TEL.pages.audience = page;
})();


/* ==========================================================================
   08 · 性能
   ========================================================================== */
(function () {
  'use strict';
  const TEL = window.TEL;
  const C = TEL.core;
  const S = TEL.comp;
  const U = TEL.ui;
  const state = C.state;
  const REPS = [50, 200, 550, 1400, 3000];

  function percentile(buckets, p) {
    const total = C.sum(buckets);
    if (!total) return 0;
    let acc = 0;
    for (let i = 0; i < buckets.length; i++) {
      acc += buckets[i];
      if (acc >= total * p) return REPS[i];
    }
    return REPS[REPS.length - 1];
  }

  function health(ms) {
    if (ms < 250) return { label: '快', tone: 'good' };
    if (ms < 420) return { label: '正常', tone: 'ok' };
    if (ms < 650) return { label: '偏慢', tone: 'warn' };
    return { label: '慢', tone: 'bad' };
  }

  function sortRows(rows) {
    const s = state.perfSort || { key: 'avgMs', dir: 'asc' };
    const list = rows.slice();
    list.sort((a, b) => {
      let x = a[s.key], y = b[s.key];
      if (typeof x === 'string') return s.dir === 'asc' ? x.localeCompare(y) : y.localeCompare(x);
      return s.dir === 'asc' ? x - y : y - x;
    });
    return list;
  }

  function paintStack(root) {
    const w = C.weightedRender(state.range, state.granularity);
    const rows = w.rows;
    const host = root.querySelector('#stackRows');
    if (!host) return;
    host.innerHTML = rows.map((r) => {
      const total = C.sum(r.buckets) || 1;
      const segs = r.buckets.map((count, i) => {
        const pct = (count / total) * 100;
        return '<i class="seg" style="--w:' + pct.toFixed(2) + '%;background:var(' + C.RENDER_COLORS[i] + ')" '
          + 'data-ver="' + U.esc(r.version) + '" data-b="' + i + '" data-c="' + count + '" data-p="' + pct.toFixed(2) + '" '
          + 'tabindex="0" role="img" aria-label="' + C.RENDER_LABELS[i] + ' ' + C.fmtInt(count) + ' 个样本">'
          + (pct >= 11 ? '<span>' + Math.round(pct) + '%</span>' : '') + '</i>';
      }).join('');
      const h = health(r.avgMs);
      return '<div class="stack-row" style="--i:' + rows.indexOf(r) + '">'
        + '<span class="sr-name"><b>' + U.esc(r.version) + '</b><em>' + C.fmtPct(r.deviceShare, 0) + ' 设备</em></span>'
        + '<div class="sr-bar">' + segs + '</div>'
        + '<span class="sr-avg ' + h.tone + '">' + C.fmtMs(r.avgMs) + '</span>'
        + '</div>';
    }).join('');
    host.querySelectorAll('.seg').forEach((seg) => {
      let segTouch = false;
      const show = (e) => {
        segTouch = e.pointerType === 'touch';
        const ver = seg.getAttribute('data-ver');
        const bi = Number(seg.getAttribute('data-b'));
        const count = Number(seg.getAttribute('data-c'));
        const pct = Number(seg.getAttribute('data-p'));
        U.tip.show('<div class="tip-h">' + U.esc(ver) + '</div>'
          + '<div class="tip-row"><i style="background:var(' + C.RENDER_COLORS[bi] + ')"></i><span>' + C.RENDER_LABELS[bi] + '</span><b>' + C.fmtInt(count) + ' 样本</b></div>'
          + '<div class="tip-row"><i style="background:transparent"></i><span>版本内占比</span><b>' + pct.toFixed(1) + '%</b></div>'
          + '<div class="tip-row"><i style="background:transparent"></i><span>版本平均</span><b>' + C.fmtMs(rows.find((x) => x.version === ver).avgMs) + '</b></div>', e.clientX, e.clientY, segTouch ? { touch: true } : null);
      };
      seg.addEventListener('pointerenter', show);
      seg.addEventListener('pointermove', (e) => { segTouch = e.pointerType === 'touch'; U.tip.move(e.clientX, e.clientY); });
      seg.addEventListener('pointerleave', () => {
        if (segTouch) U.tip.hideSoon(1500);
        else U.tip.hide();
      });
      seg.addEventListener('focus', (e) => {
        const r = seg.getBoundingClientRect();
        show({ clientX: r.left + r.width / 2, clientY: r.top });
      });
      seg.addEventListener('blur', () => U.tip.hide());
    });
  }

  function paintTable(root) {
    const host = root.querySelector('#verTable');
    if (!host) return;
    const w = C.weightedRender(state.range, state.granularity);
    const rows = sortRows(w.rows.map((r) => Object.assign({}, r, {
      p90: percentile(r.buckets, 0.9),
      p50: percentile(r.buckets, 0.5),
      health: health(r.avgMs),
    })));
    const sort = state.perfSort;
    const arrow = (key) => sort.key === key ? (sort.dir === 'asc' ? '↑' : '↓') : '';
    host.innerHTML = '<div class="table-wrap"><table class="dt perf-table"><thead><tr>'
      + [['version', '版本'], ['deviceShare', '设备占比'], ['samples', '样本'], ['avgMs', '平均'], ['p50', 'P50'], ['p90', 'P90'], ['health', '状态']].map(([key, label]) =>
        '<th class="' + (key === 'version' || key === 'health' ? 'left' : 'right') + '"><button data-sort="' + key + '">' + label + '<i>' + arrow(key) + '</i></button></th>'
      ).join('') + '</tr></thead><tbody>'
      + rows.map((r) => '<tr>'
        + '<td class="left"><span class="ver-cell"><i class="vdot ' + r.health.tone + '"></i><b>' + U.esc(r.version) + '</b></span></td>'
        + '<td class="right">' + C.fmtPct(r.deviceShare, 1) + '</td>'
        + '<td class="right">' + C.fmtInt(r.samples) + '</td>'
        + '<td class="right mono">' + C.fmtMs(r.avgMs) + '</td>'
        + '<td class="right mono muted">' + C.fmtMs(r.p50) + '</td>'
        + '<td class="right mono muted">' + C.fmtMs(r.p90) + '</td>'
        + '<td class="left"><span class="pill ' + r.health.tone + '">' + r.health.label + '</span></td>'
        + '</tr>').join('')
      + '</tbody></table></div>';
    host.querySelectorAll('[data-sort]').forEach((b) => b.addEventListener('click', () => {
      const key = b.getAttribute('data-sort');
      if (state.perfSort.key === key) state.perfSort.dir = state.perfSort.dir === 'asc' ? 'desc' : 'asc';
      else state.perfSort = { key, dir: key === 'version' ? 'desc' : 'asc' };
      paintTable(root);
    }));
  }

  function paintInsights(root) {
    const host = root.querySelector('#perfInsights');
    if (!host) return;
    const w = C.weightedRender(state.range, state.granularity);
    const rows = w.rows.filter((r) => r.avgMs !== null && r.samples > 0);
    if (!rows.length) {
      host.innerHTML = S.empty('当前窗口没有可对比的版本', '渲染耗时由客户端在打开面板时上报，样本积累后会出现在这里。');
      return;
    }
    const slow = rows[0];
    const fast = rows[rows.length - 1];
    const slowShare = (w.buckets[3] + w.buckets[4]) / (C.sum(w.buckets) || 1);
    const gain = slow && fast && slow.avgMs ? (slow.avgMs - fast.avgMs) / slow.avgMs : 0;
    const ratio = slow && fast && fast.avgMs ? slow.avgMs / fast.avgMs : 1;
    host.innerHTML = '<div class="insight-list">'
      + '<div class="il-item"><span class="il-ic good">' + U.icon('zap') + '</span><div><b>最快版本</b><p>' + U.esc(fast.version) + ' 平均 ' + C.fmtMs(fast.avgMs) + '，共 ' + C.fmtInt(fast.samples) + ' 个样本。</p></div></div>'
      + '<div class="il-item"><span class="il-ic warn">' + U.icon('clock') + '</span><div><b>慢样本占比</b><p>≥2s 的渲染占 <em>' + C.fmtPct(slowShare) + '</em>，优先排查低端设备与长会话。</p></div></div>'
      + '<div class="il-item"><span class="il-ic bad">' + U.icon('alert') + '</span><div><b>最慢版本</b><p>' + U.esc(slow.version) + ' 平均 <em>' + C.fmtMs(slow.avgMs) + '</em>，仍覆盖 ' + C.fmtPct(slow.deviceShare, 0) + ' 的设备。</p></div></div>'
      + '</div>'
      + '<div class="il-extra"><div class="ie-head">下一步建议</div>'
      + '<div class="ie-item"><b>1</b><span>把 ' + U.esc(slow.version) + ' 用户引导到 ' + U.esc(fast.version) + '：平均耗时相差 ' + ratio.toFixed(1) + ' 倍，约省 ' + C.fmtPct(gain, 0) + '。</span></div>'
      + '<div class="ie-item"><b>2</b><span>≥2s 样本优先从旧版本入手排查，再看设备性能分桶。</span></div></div>'
      + '<div class="setting-note">' + U.icon('info') + '<span>均值由客户端上报的 5 档耗时按档位代表值加权估算，用于版本间横向比较。</span></div>';
  }

  function page(root) {
    const cur = C.weightedRender(state.range, state.granularity);
    // 服务端只按当前窗口聚合渲染耗时，环比没有可比基数，因此不显示对比徽标
    const d = null;
    const h = health(cur.avgMs);
    const slowShare = (cur.buckets[3] + cur.buckets[4]) / (C.sum(cur.buckets) || 1);
    if (!cur.samples) {
      root.innerHTML = '<div class="stack"><section class="card rise">'
        + S.head('渲染耗时', '客户端上报的面板渲染样本')
        + '<div class="card-body">' + S.empty('当前窗口没有渲染样本', '渲染耗时在打开面板时上报；换一个时间范围，或等新版本上报后再看。') + '</div>'
        + '</section></div>';
      S.initCommon(root);
      return;
    }
    const pos = Math.max(2, Math.min(97, (cur.avgMs / 2000) * 100));

    root.innerHTML = '<div class="stack">'
      + '<section class="card perf-hero rise">'
      + '<div class="ph-main">'
      + '<div class="ph-label">平均渲染耗时<span class="pill ' + h.tone + '">' + h.label + '</span></div>'
      + '<div class="ph-value"><b class="count" data-val="' + cur.avgMs + '" data-format="int">' + C.fmtInt(cur.avgMs) + '</b><span>ms</span>'
      + '<em>' + S.deltaChip(d, { invert: true }) + '<small>较上一周期</small></em></div>'
      + '<div class="perf-scale"><div class="ps-track"><i class="ps-zone good"></i><i class="ps-zone warn"></i><i class="ps-zone bad"></i>'
      + '<i class="ps-fill" style="width:0"></i><span class="ps-pin" style="left:0"><b></b></span></div>'
      + '<div class="ps-labels"><span class="l0">0</span><span class="lb" style="left:15%">300 良好</span><span class="lb" style="left:40%">800 偏慢</span><span class="lr">2000+ ms</span></div></div>'
      + '</div>'
      + '<div class="ph-stats">'
      + '<div><span>P50</span><b>' + C.fmtMs(cur.p50) + '</b><em>一半样本快于此</em></div>'
      + '<div><span>P90</span><b>' + C.fmtMs(cur.p90) + '</b><em>长尾参考</em></div>'
      + '<div><span>样本数</span><b>' + C.fmtInt(cur.samples) + '</b><em>窗口内样本</em></div>'
      + '<div><span>慢样本</span><b>' + C.fmtPct(slowShare) + '</b><em>≥ 2000 ms</em></div>'
      + '</div>'
      + '</section>'

      + '<div class="grid split">'
      + '<section class="card rise">'
      + S.head('版本耗时分布', '每行合计 100% · 颜色越靠右越慢', '<span class="small-note">' + C.renderWindowSub() + '</span>')
      + '<div class="card-body"><div class="stack-legend">' + C.RENDER_LABELS.map((label, i) =>
        '<span><i style="background:var(' + C.RENDER_COLORS[i] + ')"></i>' + label + '</span>'
      ).join('') + '</div><div class="stack-rows" id="stackRows"></div></div>'
      + '<footer class="card-foot"><span class="foot-note">每行宽度代表该版本的样本占比；右侧为该版本估算均值。</span></footer>'
      + '</section>'

      + '<section class="card rise">'
      + S.head('性能结论', '自动从当前窗口提取')
      + '<div class="card-body" id="perfInsights"></div>'
      + '</section>'
      + '</div>'

      + '<section class="card rise">'
      + S.head('版本明细', '点击表头排序 · P50 / P90 由 5 档分布估算')
      + '<div class="card-body flush" id="verTable"></div>'
      + '<footer class="card-foot"><span class="foot-note">样本来自客户端分档上报，按档位代表值加权估算，仅用于版本间横向比较。</span></footer>'
      + '</section>'
      + '</div>';

    paintStack(root);
    paintTable(root);
    paintInsights(root);
    S.initCommon(root);

    const pin = root.querySelector('.ps-pin');
    const fill = root.querySelector('.ps-fill');
    if (pin && fill) {
      requestAnimationFrame(() => {
        const ease = '.9s cubic-bezier(.22,1,.36,1)';
        fill.style.transition = 'width ' + ease;
        pin.style.transition = 'left ' + ease;
        fill.style.width = pos.toFixed(1) + '%';
        pin.style.left = pos.toFixed(1) + '%';
      });
    }
  }

  TEL.pages = TEL.pages || {};
  TEL.pages.performance = page;
})();


/* ==========================================================================
   09 · 自定义探索
   ========================================================================== */
(function () {
  'use strict';
  const TEL = window.TEL;
  const C = TEL.core;
  const S = TEL.comp;
  const U = TEL.ui;
  const state = C.state;

  const COLORS = ['--chart-1', '--chart-2', '--chart-3', '--chart-4', '--chart-5', '--chart-6', '--chart-7', '--chart-8'];

  function safeConfig() {
    const dims = C.DIMENSIONS.map(([k]) => k);
    if (dims.indexOf(state.explore.dim) < 0) state.explore.dim = 'os';
    if (['bar', 'donut', 'share'].indexOf(state.explore.viz) < 0) state.explore.viz = 'bar';
    if ([5, 8, 12, 20].indexOf(Number(state.explore.topN)) < 0) state.explore.topN = 8;
    if (['value', 'name'].indexOf(state.explore.sort) < 0) state.explore.sort = 'value';
  }

  function data() {
    return C.explore(state.explore.dim, state.explore.topN, state.explore.sort);
  }

  function previewTitle(d) {
    const measure = d.unit === '次打开' ? '打开次数' : '设备数';
    return '按' + d.label + ' · ' + measure;
  }

  function paintPreview(root) {
    const d = data();
    const title = root.querySelector('#exTitle');
    const sub = root.querySelector('#exSub');
    if (title) title.textContent = previewTitle(d);
    if (sub) sub.textContent = '累计快照 · ' + C.fmtInt(d.total) + ' ' + (d.unit === '次打开' ? '次打开' : '台设备') + ' · 不随顶部时间范围变化';
    const host = root.querySelector('#exBody');
    if (!host) return;

    if (state.explore.viz === 'bar') {
      const items = d.items.map((x, i) => ({
        label: x.label, value: x.count, display: C.fmtInt(x.count), total: d.total,
        color: x.merged ? 'var(--chart-8)' : 'var(' + COLORS[i % COLORS.length] + ')',
      }));
      host.innerHTML = S.rankList(items, { showShare: true });
    } else if (state.explore.viz === 'donut') {
      const colors = d.items.map((x, i) => (x.merged ? 'var(--chart-8)' : 'var(' + COLORS[i % COLORS.length] + ')'));
      host.innerHTML = '<div class="ex-donut"><div class="chart-host" id="exDonut" style="height:230px"></div>'
        + '<div class="donut-legend">' + d.items.map((x, i) =>
          '<div class="dl-row"><i class="sw" style="background:' + colors[i] + '"></i><span class="dl-label">' + U.esc(x.label) + '</span>'
          + '<span class="dl-val">' + C.fmtPct(x.share) + '</span></div>'
        ).join('') + '</div></div>';
      const donutHost = host.querySelector('#exDonut');
      TEL.charts.donut(donutHost, {
        items: d.items.map((x, i) => ({ label: x.label, value: x.count, color: colors[i] })),
        value: C.fmtCompact(d.total),
        label: d.unit === '次打开' ? '次打开' : '台设备',
        aria: previewTitle(d),
      });
    } else {
      const segments = d.items.map((x, i) => {
        const color = x.merged ? 'var(--chart-8)' : 'var(' + COLORS[i % COLORS.length] + ')';
        return '<i style="--w:' + (x.share * 100).toFixed(2) + '%;background:' + color + '" title="' + U.esc(x.label) + ' ' + C.fmtPct(x.share) + '"></i>';
      }).join('');
      host.innerHTML = '<div class="share-bar">' + segments + '</div>'
        + '<div class="share-legend">' + d.items.map((x, i) =>
          '<div class="sl-row"><i style="background:' + (x.merged ? 'var(--chart-8)' : 'var(' + COLORS[i % COLORS.length] + ')') + '"></i>'
          + '<span>' + U.esc(x.label) + '</span><b>' + C.fmtInt(x.count) + '</b><em>' + C.fmtPct(x.share) + '</em></div>'
        ).join('') + '</div>';
    }

    const foot = root.querySelector('#exFoot');
    if (foot) {
      const top = d.items.filter((x) => !x.merged)[0];
      foot.textContent = top
        ? '占比最高：' + top.label + ' ' + C.fmtPct(top.share) + ' · 共 ' + d.items.length + ' 组'
        : '暂无数据';
    }
  }

  function paintSaved(root) {
    const host = root.querySelector('#savedList');
    if (!host) return;
    if (!state.saved.length) {
      host.innerHTML = '<div class="saved-empty">' + U.icon('bookmark') + '<span>还没有保存的视图。<br>调整左侧配置后点「保存视图」。</span></div>';
      return;
    }
    host.innerHTML = state.saved.map((v) => '<div class="saved-item">'
      + '<button class="si-main" data-apply="' + v.id + '"><b>' + U.esc(v.name) + '</b><small>' + U.esc(v.sub) + '</small></button>'
      + '<button class="icon-btn sm" data-del="' + v.id + '" aria-label="删除视图">' + U.icon('trash') + '</button>'
      + '</div>').join('');
    host.querySelectorAll('[data-apply]').forEach((b) => b.addEventListener('click', () => {
      const v = state.saved.find((x) => String(x.id) === b.getAttribute('data-apply'));
      if (!v) return;
      state.explore = { dim: v.dim, viz: v.viz, topN: v.topN, sort: v.sort };
      C.saveStore();
      U.route.syncURL(false);
      U.route.render(false);
      U.toast('已应用「' + v.name + '」', 'ok');
    }));
    host.querySelectorAll('[data-del]').forEach((b) => b.addEventListener('click', () => {
      const id = b.getAttribute('data-del');
      state.saved = state.saved.filter((x) => String(x.id) !== id);
      C.saveStore();
      paintSaved(root);
      U.toast('已删除保存的视图');
    }));
  }

  function saveView(root) {
    const d = data();
    const name = C.fmtDate(C.END).slice(0, 4) + ' · ' + d.label + ' / ' + ({ bar: '条形', donut: '环形', share: '占比' }[state.explore.viz]);
    const s = U.sheet({
      title: '保存当前视图',
      sub: '保存在本机，下次打开仍在',
      body: '<label class="field"><span>视图名称</span><input id="viewName" type="text" maxlength="40" value="' + U.esc(name) + '"></label>'
        + '<div class="setting-note">' + U.icon('info') + '<span>会保存维度、图形、Top N 与排序，不包含时间范围。</span></div>',
      foot: '<button class="btn ghost" data-cancel>取消</button><button class="btn primary" data-save>保存</button>',
    });
    const input = s.panel.querySelector('#viewName');
    setTimeout(() => { input.focus(); input.select(); }, 80);
    s.panel.querySelector('[data-cancel]').addEventListener('click', s.close);
    input.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') { e.preventDefault(); s.panel.querySelector('[data-save]').click(); }
    });
    s.panel.querySelector('[data-save]').addEventListener('click', () => {
      const label = input.value.trim() || name;
      state.saved.unshift({
        id: Date.now(),
        name: label,
        sub: d.label + ' · ' + ({ bar: '条形', donut: '环形', share: '占比' }[state.explore.viz]) + ' · Top ' + state.explore.topN,
        dim: state.explore.dim, viz: state.explore.viz, topN: state.explore.topN, sort: state.explore.sort,
      });
      state.saved = state.saved.slice(0, 8);
      C.saveStore();
      paintSaved(root);
      s.close();
      U.toast('视图已保存', 'ok');
    });
  }

  function applyControl(root, key, value) {
    state.explore[key] = value;
    C.saveStore();
    U.route.syncURL(false);
    root.querySelectorAll('[data-seg="ex' + key + '"] button').forEach((b) => {
      const on = b.getAttribute('data-v') === String(value);
      b.classList.toggle('on', on);
      b.setAttribute('aria-pressed', String(on));
    });
    paintPreview(root);
  }

  function page(root) {
    safeConfig();
    const d = data();
    const dimSel = '<label class="field field-full"><span>拆分维度</span><div class="select-wrap">'
      + '<select id="dimSel" class="select">' + C.DIMENSIONS.map(([key, label]) =>
        '<option value="' + key + '"' + (state.explore.dim === key ? ' selected' : '') + '>' + label + '</option>'
      ).join('') + '</select>' + U.icon('chevron-down') + '</div>'
      + '<small>维度来自每台设备最近一次上报的累计快照</small></label>';

    root.innerHTML = '<div class="stack">'
      + '<section class="card ex-hero rise">'
      + '<div><span class="eyebrow">' + U.icon('sliders') + '自定义视图</span>'
      + '<h2>按任意维度切开数据</h2>'
      + '<p>选择维度、图形与 Top N，右侧即时预览。配置会写入链接，也可以保存为本机视图。</p></div>'
      + '<div class="ex-hero-tag">' + U.icon('database') + '<span>累计口径<br><b>不随时间范围变化</b></span></div>'
      + '</section>'

      + '<div class="ex-layout">'
      + '<aside class="ex-side">'
      + '<section class="card builder rise">'
      + S.head('配置', '改动即时生效')
      + '<div class="card-body">'
      + dimSel
      + '<div class="field field-full"><span>显示为</span>' + S.seg('exviz', [['bar', '条形'], ['donut', '环形'], ['share', '占比条']], state.explore.viz) + '</div>'
      + '<div class="field"><span>Top N</span>' + S.seg('extopN', [[5, '5'], [8, '8'], [12, '12'], [20, '20']], state.explore.topN) + '</div>'
      + '<div class="field"><span>排序</span>' + S.seg('exsort', [['value', '按数量'], ['name', '按名称']], state.explore.sort) + '</div>'
      + '<div class="builder-actions">'
      + '<button class="btn primary" data-act="ex-save">' + U.icon('bookmark') + '保存视图</button>'
      + '<button class="btn ghost" data-act="ex-csv">' + U.icon('download') + '</button>'
      + '</div>'
      + '<div class="setting-note">' + U.icon('info') + '<span>页面维度按打开次数，其余按设备数。</span></div>'
      + '</div>'
      + '</section>'
      + '</aside>'

      + '<div class="ex-main">'
      + '<section class="card preview rise">'
      + S.head('<span id="exTitle">' + U.esc(previewTitle(d)) + '</span>', '<span id="exSub"></span>',
        '<span class="badge-soft">' + U.icon('pin') + '累计</span>')
      + '<div class="card-body" id="exBody"></div>'
      + '<footer class="card-foot"><span class="foot-note" id="exFoot"></span><button class="text-btn" data-act="ex-csv2">导出 CSV' + U.icon('download') + '</button></footer>'
      + '</section>'

      + '<section class="card rise">'
      + S.head('已保存视图', '本机保存 · 最多 8 个')
      + '<div class="card-body" id="savedList"></div>'
      + '</section>'
      + '</div>'
      + '</div>'
      + '</div>';

    const sel = root.querySelector('#dimSel');
    sel.addEventListener('change', () => applyControl(root, 'dim', sel.value));
    [['exviz', 'viz'], ['extopN', 'topN'], ['exsort', 'sort']].forEach(([name, key]) => {
      root.querySelectorAll('[data-seg="' + name + '"] button').forEach((b) => b.addEventListener('click', () => {
        const raw = b.getAttribute('data-v');
        applyControl(root, key, key === 'topN' ? Number(raw) : raw);
      }));
    });
    root.querySelector('[data-act="ex-save"]').addEventListener('click', () => saveView(root));
    root.querySelector('[data-act="ex-csv"]').addEventListener('click', () => U.exportData());
    root.querySelector('[data-act="ex-csv2"]').addEventListener('click', () => U.exportData());

    paintPreview(root);
    paintSaved(root);
    S.initCommon(root);
  }

  TEL.pages = TEL.pages || {};
  TEL.pages.explore = page;
})();


/* ==========================================================================
   10 · 启动
   ========================================================================== */
(function () {
  'use strict';
  const TEL = window.TEL;
  function boot() {
    try {
      TEL.bootShell();
      TEL.ui.route.render(false);
      document.documentElement.classList.add('ready');
      if (TEL.data.meta.offline) {
        const foot = document.querySelector('.pagefoot span');
        if (foot) foot.textContent = '离线快照 · 未连接数据接口，仅展示页面结构';
      }
    } catch (error) {
      console.error('[telemetry] boot failed', error);
      const main = document.getElementById('main');
      if (main) {
        main.innerHTML = '<div class="card" style="padding:24px"><h2>页面初始化失败</h2><p style="color:var(--text-2);margin-top:6px">'
          + String(error && error.message ? error.message : error) + '</p></div>';
      }
    }
  }
  // ?force=1 只作用于本次加载：立刻清掉，避免复制 / 刷新时带上
  if (/[?&]force=1/.test(location.search)) {
    try { history.replaceState(null, '', location.pathname + location.hash); } catch (error) { /* ignore */ }
  }
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot);
  else requestAnimationFrame(boot);
})();
</script>
</body>
</html>

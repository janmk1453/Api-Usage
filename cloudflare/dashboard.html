<!doctype html>
<html lang="zh-CN" data-theme="light" data-rail="full">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F7F7F4">
<title>概览 · 遥测看板</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='9' fill='%23F26A1B'/%3E%3Cpath d='M6 18h5l3-8 4 14 3-8 2 2h4' stroke='%23fff' stroke-width='2.2' fill='none' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
<style>/* ==========================================================================
   遥测看板 · 设计系统
   1 令牌 / 2 基础 / 3 外壳 / 4 组件 / 5 页面 / 6 浮层 / 7 响应式
   ========================================================================== */

/* ------------------------------- 1. 令牌 -------------------------------- */
:root {
  --font: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Helvetica Neue", sans-serif;
  --mono: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;

  --rail-w: 232px;
  --topbar-h: 64px;
  --maxw: 1380px;

  --r-xs: 8px;
  --r-sm: 10px;
  --r-md: 14px;
  --r-lg: 16px;
  --r-xl: 20px;

  --ease: cubic-bezier(.22, 1, .36, 1);
  --ease-out: cubic-bezier(.16, 1, .3, 1);
}

html[data-theme="light"] {
  color-scheme: light;
  --bg: #F7F7F4;
  --surface: #FFFFFF;
  --surface-2: #F2F2EE;
  --surface-3: #E8E8E2;
  --line: #E7E6E0;
  --line-strong: #D4D2C9;
  --text: #17191B;
  --text-2: #5C6267;
  --text-3: #8B9196;
  --accent: #F26A1B;
  --accent-strong: #D95A10;
  --accent-soft: #FFF0E6;
  --green: #0E8F68;
  --green-soft: #E7F7F0;
  --red: #D14343;
  --red-soft: #FDEEEE;
  --amber: #B87A0B;
  --amber-soft: #FBF3DF;
  --blue: #2F6BFF;
  --violet: #7C5CFF;
  --chart-1: #F26A1B;
  --chart-2: #2F6BFF;
  --chart-3: #0E8F68;
  --chart-4: #7C5CFF;
  --chart-5: #C08A12;
  --chart-6: #0E93A8;
  --chart-7: #D94F8A;
  --chart-8: #8B9196;
  /* 渲染耗时 5 档（浅色）：绿 → 青 → 黄 → 橙 → 粉，暖度递增 */
  --rb-1: #0E8F68;
  --rb-2: #3AB7CC;
  --rb-3: #C08A12;
  --rb-4: #F26A1B;
  --rb-5: #E86AA0;
  --sh-1: 0 1px 2px rgba(20, 22, 24, .035);
  --sh-2: 0 10px 30px -18px rgba(20, 22, 24, .22), 0 1px 2px rgba(20, 22, 24, .04);
  --sh-3: 0 26px 70px -28px rgba(16, 18, 20, .35), 0 2px 6px rgba(16, 18, 20, .05);
  --mask: rgba(18, 20, 22, .34);
  --topbar-bg: rgba(247, 247, 244, .82);
  --tip-bg: #1B1D1F;
  --tip-text: #F6F6F3;
  --tip-border: #2C2F32;
  --code-bg: #F0EFEA;
}

html[data-theme="dark"] {
  color-scheme: dark;
  --bg: #0B0C0E;
  --surface: #121417;
  --surface-2: #191C20;
  --surface-3: #23272C;
  --line: #24282D;
  --line-strong: #363C43;
  --text: #ECEDEF;
  --text-2: #A1A7AE;
  --text-3: #747B82;
  --accent: #FF7A2F;
  --accent-strong: #FF9255;
  --accent-soft: rgba(255, 122, 47, .12);
  --green: #45BE8E;
  --green-soft: rgba(69, 190, 142, .12);
  --red: #F06A6A;
  --red-soft: rgba(240, 106, 106, .13);
  --amber: #DDA445;
  --amber-soft: rgba(221, 164, 69, .13);
  --blue: #6D8FDB;
  --violet: #8C79D9;
  --chart-1: #DE6B2A;
  --chart-2: #6484CB;
  --chart-3: #3A9C7A;
  --chart-4: #8270C9;
  --chart-5: #BE9549;
  --chart-6: #37929F;
  --chart-7: #C86C90;
  --chart-8: #8B949E;
  /* 渲染耗时 5 档（深色）：绿 → 蓝 → 黄 → 橙 → 红，暖度递增 */
  --rb-1: #3A9C7A;
  --rb-2: #6484CB;
  --rb-3: #BE9549;
  --rb-4: #DE6B2A;
  --rb-5: #D25454;
  --sh-1: 0 1px 2px rgba(0, 0, 0, .3);
  --sh-2: 0 14px 34px -20px rgba(0, 0, 0, .7), 0 1px 2px rgba(0, 0, 0, .4);
  --sh-3: 0 30px 80px -30px rgba(0, 0, 0, .9), 0 2px 8px rgba(0, 0, 0, .5);
  --mask: rgba(0, 0, 0, .58);
  --topbar-bg: rgba(11, 12, 14, .82);
  --tip-bg: #23272C;
  --tip-text: #F0F1F3;
  --tip-border: #343B43;
  --code-bg: #1C2024;
}

/* -------------------------------- 2. 基础 ------------------------------- */
*, *::before, *::after { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--text);
  font-family: var(--font);
  font-size: 13px;
  line-height: 1.55;
  -webkit-font-smoothing: antialiased;
  text-rendering: optimizeLegibility;
  transition: background-color .25s ease, color .25s ease;
}
body.sheet-open { overflow: hidden; }
h1, h2, h3, p { margin: 0; }
button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; }
input, select, textarea { font: inherit; color: inherit; }
a { color: inherit; text-decoration: none; }
svg { display: block; }
ul { margin: 0; padding: 0; }
::selection { background: color-mix(in srgb, var(--accent) 24%, transparent); }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 4px; }
::-webkit-scrollbar { width: 10px; height: 10px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: var(--line-strong); border: 3px solid var(--bg); border-radius: 99px; }
::-webkit-scrollbar-thumb:hover { background: var(--text-3); }
html { scrollbar-width: thin; scrollbar-color: var(--line-strong) transparent; }

.ic { width: 18px; height: 18px; stroke: currentColor; fill: none; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; flex: none; }
.ic.sm { width: 15px; height: 15px; }
.muted { color: var(--text-3); }
.mono { font-family: var(--mono); font-variant-numeric: tabular-nums; }

.skip {
  position: fixed; left: 12px; top: -60px; z-index: 200;
  background: var(--text); color: var(--bg); padding: 8px 14px; border-radius: 8px;
  transition: top .2s var(--ease);
}
.skip:focus { top: 12px; }

/* -------------------------------- 3. 外壳 ------------------------------- */
.app { min-height: 100dvh; }
.rail {
  position: fixed; inset: 0 auto 0 0; z-index: 30;
  width: var(--rail-w);
  display: flex; flex-direction: column;
  background: var(--surface);
  border-right: 1px solid var(--line);
  padding: 10px 10px 12px;
  transition: width .26s var(--ease), padding .26s var(--ease);
}
.rail-top { display: flex; align-items: center; gap: 8px; padding: 4px 4px 14px; min-height: 52px; }
.brand { display: flex; align-items: center; gap: 10px; min-width: 0; flex: 1; padding: 4px; border-radius: 10px; }
.brand:hover { background: var(--surface-2); }
.brand-mark {
  width: 30px; height: 30px; border-radius: 9px; flex: none;
  background: linear-gradient(145deg, var(--accent), color-mix(in srgb, var(--accent) 66%, #FFC08A));
  box-shadow: 0 6px 14px -8px color-mix(in srgb, var(--accent) 80%, transparent);
  display: grid; place-items: center;
}
.brand-mark svg { width: 18px; height: 18px; }
.brand-txt { min-width: 0; display: flex; flex-direction: column; line-height: 1.25; }
.brand-txt b { font-size: 13px; font-weight: 650; letter-spacing: -.01em; white-space: nowrap; }
.brand-txt small { font-size: 10px; color: var(--text-3); white-space: nowrap; margin-top: 2px; }
.rail-collapse { opacity: 0; transition: opacity .18s ease; }
.rail:hover .rail-collapse, .rail-collapse:focus-visible { opacity: 1; }

.nav { display: flex; flex-direction: column; gap: 2px; margin-top: 4px; }
.nav-label { font-size: 9.5px; letter-spacing: .09em; text-transform: uppercase; color: var(--text-3); padding: 10px 10px 6px; }
.nav-item {
  display: flex; align-items: center; gap: 10px;
  height: 38px; padding: 0 10px; border-radius: 9px;
  color: var(--text-2); font-size: 12.5px; font-weight: 500;
  position: relative; transition: background .16s ease, color .16s ease;
}
.nav-item .ic { width: 17px; height: 17px; color: var(--text-3); transition: color .16s ease; }
.nav-item:hover { background: var(--surface-2); color: var(--text); }
.nav-item:hover .ic { color: var(--text-2); }
.nav-item.on { background: var(--accent-soft); color: var(--accent); font-weight: 600; }
.nav-item.on .ic { color: var(--accent); }
.nav-item .nav-k {
  margin-left: auto; font-family: var(--mono); font-size: 9.5px; color: var(--text-3);
  opacity: 0; transition: opacity .16s ease;
}
.nav-item:hover .nav-k { opacity: .8; }
.rail-sep { height: 1px; background: var(--line); margin: 10px 8px; }
.rail-note { font-size: 10px; color: var(--text-3); padding: 0 10px; line-height: 1.6; }
.rail-foot { margin-top: auto; padding-top: 10px; }
.sync {
  display: flex; align-items: center; gap: 8px; padding: 9px 10px; border-radius: 10px;
  background: var(--surface-2); border: 1px solid transparent;
}
.sync .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--green); box-shadow: 0 0 0 3px var(--green-soft); flex: none; }
.sync div { display: flex; flex-direction: column; line-height: 1.3; min-width: 0; }
.sync b { font-size: 10.5px; font-weight: 600; }
.sync small { font-size: 9.5px; color: var(--text-3); margin-top: 1px; }

.mainwrap { margin-left: var(--rail-w); min-height: 100dvh; display: flex; flex-direction: column; transition: margin-left .26s var(--ease); }
.topbar {
  position: sticky; top: 0; z-index: 20;
  height: var(--topbar-h); flex: none;
  display: flex; align-items: center; justify-content: space-between; gap: 16px;
  padding: 0 28px;
  background: var(--topbar-bg);
  -webkit-backdrop-filter: saturate(180%) blur(14px);
  backdrop-filter: saturate(180%) blur(14px);
  border-bottom: 1px solid transparent;
  transition: border-color .2s ease, box-shadow .2s ease, background .25s ease;
}
.topbar.scrolled { border-bottom-color: var(--line); box-shadow: 0 12px 28px -28px rgba(0, 0, 0, .45); }
.tb-left { min-width: 0; display: flex; align-items: center; gap: 10px; }
.tb-titles { min-width: 0; }
.tb-titles h1 { font-size: 19px; font-weight: 650; letter-spacing: -.025em; line-height: 1.25; }
.tb-titles p { font-size: 11.5px; color: var(--text-3); margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.tb-right { display: flex; align-items: center; gap: 6px; flex: none; }
.tb-right .divider { width: 1px; height: 20px; background: var(--line); margin: 0 4px; }

.search-trigger {
  display: flex; align-items: center; gap: 8px; height: 34px; padding: 0 8px 0 10px;
  width: 196px; border: 1px solid var(--line); border-radius: 10px;
  background: var(--surface); color: var(--text-3); font-size: 11.5px;
  transition: border-color .16s ease, background .16s ease;
}
.search-trigger:hover { border-color: var(--line-strong); background: var(--surface-2); }
.search-trigger span { flex: 1; text-align: left; }
.search-trigger kbd { font-size: 9.5px; color: var(--text-3); border: 1px solid var(--line); background: var(--surface-2); border-radius: 5px; padding: 1px 5px; font-family: var(--mono); }
.range-trigger {
  display: flex; align-items: center; gap: 7px; height: 34px; padding: 0 9px 0 10px;
  border: 1px solid var(--line); border-radius: 10px; background: var(--surface);
  font-size: 11.5px; font-weight: 550; color: var(--text); white-space: nowrap;
  transition: border-color .16s ease, background .16s ease;
}
.range-trigger:hover { border-color: var(--line-strong); background: var(--surface-2); }
.range-trigger .ic { width: 15px; height: 15px; color: var(--text-3); }
.range-trigger .chev { width: 13px; height: 13px; margin-left: 1px; }

.icon-btn {
  width: 34px; height: 34px; border-radius: 9px; display: grid; place-items: center;
  justify-content: center; align-items: center;
  color: var(--text-2); transition: background .16s ease, color .16s ease, transform .16s ease;
  flex: none;
}
.icon-btn:hover { background: var(--surface-2); color: var(--text); }
.icon-btn:active { transform: scale(.96); }
.icon-btn[aria-pressed="true"], .icon-btn.active { background: var(--accent-soft); color: var(--accent); }
.icon-btn.sm { width: 28px; height: 28px; border-radius: 8px; }
.icon-btn.sm .ic { width: 15px; height: 15px; }
.only-mobile { display: none; }

.progress { position: fixed; top: 0; left: 0; right: 0; height: 2px; z-index: 60; background: transparent; pointer-events: none; }
.progress::before {
  content: ""; display: block; height: 100%; width: 0;
  background: linear-gradient(90deg, transparent, var(--accent), transparent);
  transition: width .5s var(--ease);
}
.progress.on::before { width: 100%; }

main { flex: 1; width: 100%; max-width: var(--maxw); margin: 0 auto; padding: 26px 28px 48px; }
.page { animation: pageIn .38s var(--ease) both; }
.page.soft { animation: none; }
.stack { display: flex; flex-direction: column; gap: 16px; }
.grid { display: grid; gap: 16px; min-width: 0; }
.g-2 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
.split { grid-template-columns: minmax(0, 1.92fr) minmax(0, 1fr); }

.pagefoot {
  max-width: var(--maxw); margin: 0 auto; width: 100%;
  padding: 0 28px 34px; display: flex; justify-content: space-between; gap: 16px;
  font-size: 10.5px; color: var(--text-3);
}
.pagefoot span:last-child { text-align: right; }

/* 移动端底部导航 */
.mtabs {
  display: none; position: fixed; left: 0; right: 0; bottom: 0; z-index: 40;
  height: calc(56px + env(safe-area-inset-bottom));
  padding-bottom: env(safe-area-inset-bottom);
  background: var(--topbar-bg);
  -webkit-backdrop-filter: saturate(180%) blur(16px);
  backdrop-filter: saturate(180%) blur(16px);
  border-top: 1px solid var(--line);
  grid-template-columns: repeat(5, 1fr);
}
.mtabs a {
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px;
  font-size: 9.5px; color: var(--text-3); transition: color .16s ease;
}
.mtabs a .ic { width: 19px; height: 19px; }
.mtabs a.on { color: var(--accent); }
.mtabs a.on .ic { stroke-width: 2; }

/* ------------------------------- 4. 组件 -------------------------------- */
.card {
  background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-lg);
  box-shadow: var(--sh-1); min-width: 0; position: relative;
  transition: border-color .2s ease, box-shadow .2s ease;
}
.card:hover { border-color: var(--line-strong); }
.card-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; padding: 16px 18px 0; }
.card-head .ct { min-width: 0; }
.card-head h2 { font-size: 14px; font-weight: 620; letter-spacing: -.012em; display: flex; align-items: center; gap: 7px; }
.card-head h2 .ic { width: 15px; height: 15px; color: var(--text-3); }
.card-head p { font-size: 11px; color: var(--text-3); margin-top: 3px; line-height: 1.5; }
.card-head p b { color: var(--text-2); font-weight: 600; }
.card-actions { display: flex; align-items: center; gap: 6px; flex: none; }
.card-body { padding: 15px 18px 17px; min-width: 0; }
.card-body.flush { padding: 0 0 4px; }
.card-foot {
  display: flex; align-items: center; justify-content: space-between; gap: 12px;
  padding: 10px 18px 13px; border-top: 1px solid var(--line);
  font-size: 11px; color: var(--text-3); min-height: 38px;
}
.foot-note { color: var(--text-3); font-size: 10.5px; line-height: 1.5; }
.foot-note b { color: var(--text-2); font-weight: 600; }
.legend-wrap { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; min-width: 0; }
.legend { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; }
.lg { display: inline-flex; align-items: center; gap: 6px; font-size: 10.5px; color: var(--text-2); white-space: nowrap; }
.lg i { width: 7px; height: 7px; border-radius: 2px; flex: none; }
.small-note { font-size: 10.5px; color: var(--text-3); white-space: nowrap; }
.badge-soft {
  display: inline-flex; align-items: center; gap: 5px; height: 24px; padding: 0 8px;
  border-radius: 7px; background: var(--surface-2); color: var(--text-2);
  font-size: 10.5px; font-weight: 550; white-space: nowrap;
}
.badge-soft .ic { width: 12px; height: 12px; }

.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 6px;
  height: 34px; padding: 0 12px; border-radius: 9px; border: 1px solid var(--line);
  background: var(--surface); color: var(--text); font-size: 12px; font-weight: 550;
  white-space: nowrap; transition: background .16s ease, border-color .16s ease, transform .12s ease;
}
.btn:hover { background: var(--surface-2); border-color: var(--line-strong); }
.btn:active { transform: scale(.985); }
.btn .ic { width: 15px; height: 15px; }
.btn.primary { background: var(--text); border-color: var(--text); color: var(--bg); }
.btn.primary:hover { opacity: .9; }
html[data-theme="dark"] .btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
html[data-theme="dark"] .btn.primary:hover { opacity: 1; background: var(--accent-strong); border-color: var(--accent-strong); }
.btn.ghost { background: transparent; }
.btn.ghost:hover { background: var(--surface-2); }
.btn.sm { height: 28px; padding: 0 9px; font-size: 11px; border-radius: 8px; }
.btn.sm .ic { width: 13px; height: 13px; }
.text-btn {
  display: inline-flex; align-items: center; gap: 3px; font-size: 11px; color: var(--text-2);
  padding: 4px 2px; border-radius: 6px; transition: color .16s ease;
}
.text-btn:hover { color: var(--accent); }
.text-btn .ic { width: 13px; height: 13px; }

.seg { display: inline-flex; align-items: center; gap: 2px; padding: 3px; background: var(--surface-2); border: 1px solid var(--line); border-radius: 9px; }
.seg button {
  height: 24px; padding: 0 9px; border-radius: 6px; font-size: 11px; font-weight: 500;
  color: var(--text-3); white-space: nowrap; transition: background .16s ease, color .16s ease, box-shadow .16s ease;
}
.seg button:hover { color: var(--text); }
.seg button.on { background: var(--surface); color: var(--text); box-shadow: 0 1px 2px rgba(0, 0, 0, .06); font-weight: 600; }
.seg button.disabled { opacity: .35; cursor: not-allowed; }
html[data-theme="dark"] .seg button.on { background: var(--surface-3); }
.seg.hide-sm { display: inline-flex; }

.kpi-grid { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; }
.kpi { padding: 15px 16px 13px; overflow: hidden; }
.kpi:hover { box-shadow: var(--sh-2); transform: translateY(-1px); }
.kpi-top { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.kpi-label { display: inline-flex; align-items: center; gap: 6px; font-size: 11.5px; color: var(--text-2); font-weight: 500; }
.kdot { width: 7px; height: 7px; border-radius: 2px; flex: none; }
.kpi-hint { font-size: 9.5px; color: var(--text-3); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 52%; }
.kpi-value { font-size: 30px; font-weight: 660; letter-spacing: -.035em; line-height: 1.15; margin-top: 7px; font-variant-numeric: tabular-nums; }
.kpi-foot { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-top: 8px; min-height: 30px; }
.kpi-delta { display: flex; flex-direction: column; gap: 1px; }
.kpi-delta .muted { font-size: 9.5px; }
.spark { width: 92px; height: 30px; flex: none; color: var(--accent); }
.spark svg { overflow: visible; }

.delta { display: inline-flex; align-items: center; gap: 2px; font-size: 11px; font-weight: 600; font-variant-numeric: tabular-nums; white-space: nowrap; }
.delta .ic { width: 11px; height: 11px; stroke-width: 2.2; }
.delta.up { color: var(--green); }
.delta.down { color: var(--red); }
.delta.flat { color: var(--text-3); }

.insight-rail { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; }
.insight {
  display: flex; align-items: center; gap: 10px; padding: 11px 13px;
  background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-md);
  min-width: 0;
}
.insight p { font-size: 11.5px; line-height: 1.55; color: var(--text-2); }
.insight p b { color: var(--text); font-weight: 620; }
.ins-ic {
  width: 27px; height: 27px; border-radius: 8px; display: grid; place-items: center; flex: none;
  background: var(--accent-soft); color: var(--accent);
}
.ins-ic .ic { width: 14px; height: 14px; }

.ex-main { display: flex; flex-direction: column; gap: 16px; min-width: 0; }

.field { display: flex; flex-direction: column; gap: 6px; }
.field > span { font-size: 10px; color: var(--text-3); font-weight: 500; }
.field small { font-size: 9.5px; color: var(--text-3); line-height: 1.5; }
.select-wrap { position: relative; }
.select {
  width: 100%; height: 36px; appearance: none; -webkit-appearance: none;
  border: 1px solid var(--line); border-radius: 9px; background: var(--surface);
  padding: 0 30px 0 10px; font-size: 11.5px; color: var(--text); cursor: pointer;
}
.select:hover { border-color: var(--line-strong); }
.select-wrap .ic { position: absolute; right: 9px; top: 50%; transform: translateY(-50%); width: 14px; height: 14px; color: var(--text-3); pointer-events: none; }
.field .seg { width: 100%; }
.field .seg button { flex: 1; height: 28px; }
.builder-actions { display: flex; gap: 7px; margin-top: 2px; }
.builder-actions .btn.primary { flex: 1; }
.builder-actions .btn.ghost { width: 40px; padding: 0; }
.preview .card-body { padding-top: 18px; padding-bottom: 18px; min-height: 300px; }
.preview .rank-list { gap: 7px; }
.preview .rank-row { padding: 7px 5px; }
.preview .rank-label { font-size: 12px; }
.preview .rank-value { font-size: 12px; }
.preview .rank-track { height: 7px; margin-top: 6px; }
.ex-donut { display: grid; grid-template-columns: 250px minmax(0, 1fr); gap: 18px; align-items: center; }
.ex-donut .donut-legend { gap: 3px; }
.share-bar { display: flex; height: 26px; border-radius: 8px; overflow: hidden; gap: 2px; background: var(--surface-2); margin: 4px 0 16px; }
.share-bar i { height: 100%; width: var(--w); display: block; animation: growX .8s var(--ease) backwards; }
.share-legend { display: grid; grid-template-columns: 1fr 1fr; gap: 2px 18px; }
.sl-row { display: grid; grid-template-columns: 8px minmax(0, 1fr) auto 42px; align-items: center; gap: 7px; padding: 5px 2px; font-size: 10.5px; border-radius: 5px; }
.sl-row:hover { background: var(--surface-2); }
.sl-row > i { width: 7px; height: 7px; border-radius: 2px; }
.sl-row span { color: var(--text-2); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.sl-row b { font-weight: 600; font-variant-numeric: tabular-nums; }
.sl-row em { font-style: normal; color: var(--text-3); text-align: right; font-variant-numeric: tabular-nums; }
.saved-empty { display: flex; align-items: center; justify-content: center; gap: 10px; min-height: 84px; color: var(--text-3); font-size: 10.5px; line-height: 1.6; text-align: left; }
.saved-empty .ic { width: 18px; height: 18px; }
.saved-item { display: flex; align-items: center; gap: 4px; border-bottom: 1px solid var(--line); }
.saved-item:last-child { border-bottom: 0; }
.si-main { flex: 1; min-width: 0; text-align: left; padding: 9px 4px; border-radius: 6px; }
.si-main:hover { background: var(--surface-2); }
.si-main b { display: block; font-size: 11px; font-weight: 550; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.si-main small { display: block; font-size: 9.5px; color: var(--text-3); margin-top: 1px; }
.ex-side .setting-note { margin-top: 0; }

/* ------------------------------- 6. 浮层 -------------------------------- */
.pop-mask { position: fixed; inset: 0; z-index: 70; background: transparent; }
.pop {
  position: fixed; z-index: 71; min-width: 220px; max-width: calc(100vw - 16px);
  background: var(--surface); border: 1px solid var(--line); border-radius: 13px;
  box-shadow: var(--sh-3); padding: 6px;
  opacity: 0; transform: translateY(-4px) scale(.99); transform-origin: top right;
  transition: opacity .16s ease, transform .16s var(--ease);
}
.pop.on { opacity: 1; transform: none; }
.pop.wide { width: 328px; }
.pop-head { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; padding: 7px 10px 6px; font-size: 10.5px; font-weight: 600; color: var(--text-3); }
.pop-note { font-weight: 400; font-size: 9.5px; }
.pop-sep { height: 1px; background: var(--line); margin: 6px 4px; }
.pop-label { font-size: 9.5px; color: var(--text-3); padding: 4px 10px 5px; }
.pop-foot { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 9px 6px 3px; }
.pop-foot .hint { font-size: 9px; color: var(--text-3); }
.menu-item {
  display: flex; align-items: center; gap: 10px; width: 100%; text-align: left;
  padding: 8px 9px; border-radius: 9px; transition: background .14s ease;
}
.menu-item:hover { background: var(--surface-2); }
.menu-item.on { background: var(--surface-2); }
.menu-ic { width: 26px; height: 26px; border-radius: 7px; display: grid; place-items: center; background: var(--surface-2); color: var(--text-2); flex: none; }
.menu-ic .ic { width: 14px; height: 14px; }
.menu-txt { flex: 1; min-width: 0; }
.menu-txt b { display: block; font-size: 11.5px; font-weight: 550; }
.menu-txt small { display: block; font-size: 9.5px; color: var(--text-3); margin-top: 1px; }
.menu-check { color: var(--accent); }
.menu-check .ic { width: 14px; height: 14px; }
.preset-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 5px; padding: 2px 4px; }
.preset { text-align: left; padding: 8px 9px; border: 1px solid var(--line); border-radius: 9px; transition: border-color .14s ease, background .14s ease; }
.preset:hover { border-color: var(--line-strong); background: var(--surface-2); }
.preset.on { border-color: var(--accent); background: var(--accent-soft); }
.preset b { display: block; font-size: 11.5px; font-weight: 600; }
.preset span { display: block; font-size: 9px; color: var(--text-3); margin-top: 1px; }
.preset.on span { color: color-mix(in srgb, var(--accent) 70%, var(--text-3)); }
.date-row { display: flex; align-items: flex-end; gap: 7px; padding: 2px 4px 4px; }
.date-row label { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 4px; }
.date-row label span { font-size: 9px; color: var(--text-3); }
.date-row input { width: 100%; height: 32px; border: 1px solid var(--line); border-radius: 8px; background: var(--surface); padding: 0 7px; font-size: 10.5px; color: var(--text); }
.date-sep { color: var(--text-3); font-size: 11px; padding-bottom: 8px; }

.sheet-mask { position: fixed; inset: 0; z-index: 90; background: var(--mask); -webkit-backdrop-filter: blur(2px); backdrop-filter: blur(2px); opacity: 0; transition: opacity .2s ease; }
.sheet-mask.on { opacity: 1; }
.sheet {
  position: fixed; z-index: 91; display: flex; flex-direction: column;
  background: var(--surface); border: 1px solid var(--line); box-shadow: var(--sh-3);
  opacity: 0; transition: transform .26s var(--ease), opacity .2s ease;
  max-height: calc(100dvh - 24px);
}
.sheet.right { top: 12px; right: 12px; bottom: 12px; width: 380px; border-radius: 16px; transform: translateX(18px); }
.sheet.right.on { opacity: 1; transform: none; }
.sheet-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 10px; padding: 16px 16px 12px; border-bottom: 1px solid var(--line); }
.sheet-head h2 { font-size: 14px; font-weight: 620; letter-spacing: -.01em; }
.sheet-head p { font-size: 10.5px; color: var(--text-3); margin-top: 2px; }
.sheet-body { padding: 4px 16px 10px; overflow: auto; flex: 1; }
.sheet-foot { display: flex; gap: 8px; justify-content: flex-end; padding: 12px 16px calc(12px + env(safe-area-inset-bottom)); border-top: 1px solid var(--line); }
.sheet-foot .btn.ghost { margin-right: auto; }
.setting-group { padding: 14px 0; border-bottom: 1px solid var(--line); }
.setting-group:last-of-type { border-bottom: 0; }
.sg-head { display: flex; align-items: baseline; justify-content: space-between; margin-bottom: 9px; }
.sg-head b { font-size: 11.5px; font-weight: 600; }
.sg-head span { font-size: 9.5px; color: var(--text-3); }
.setting-group .seg { width: 100%; }
.setting-group .seg button { flex: 1; height: 27px; }
.switch-row { display: flex; align-items: center; justify-content: space-between; gap: 14px; padding: 9px 0; }
.switch-row b { display: block; font-size: 11.5px; font-weight: 550; }
.switch-row small { display: block; font-size: 9.5px; color: var(--text-3); margin-top: 1px; line-height: 1.5; }
.switch { position: relative; width: 36px; height: 21px; flex: none; }
.switch input { position: absolute; opacity: 0; width: 0; height: 0; }
.switch i { position: absolute; inset: 0; border-radius: 99px; background: var(--surface-3); transition: background .18s ease; }
.switch i::after { content: ""; position: absolute; top: 2px; left: 2px; width: 17px; height: 17px; border-radius: 50%; background: #fff; box-shadow: 0 1px 3px rgba(0, 0, 0, .2); transition: transform .2s var(--ease); }
.switch input:checked + i { background: var(--accent); }
.switch input:checked + i::after { transform: translateX(15px); }
.switch input:disabled + i { opacity: .4; }
.switch input:focus-visible + i { outline: 2px solid var(--accent); outline-offset: 2px; }
.menu-stack { display: flex; flex-direction: column; gap: 2px; padding: 6px 0; }
.menu-stack .menu-item { padding: 11px 9px; }
.kv-list { display: flex; flex-direction: column; gap: 2px; padding: 8px 0; }
.kv { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 9px 2px; border-bottom: 1px solid var(--line); font-size: 11px; }
.kv:last-child { border-bottom: 0; }
.kv kbd { font-family: var(--mono); font-size: 10px; background: var(--surface-2); border: 1px solid var(--line); border-radius: 5px; padding: 2px 7px; color: var(--text-2); }
.about { font-size: 11.5px; line-height: 1.7; color: var(--text-2); padding: 8px 0; }
.about h3 { font-size: 11.5px; color: var(--text); margin: 16px 0 5px; }
.about p + p { margin-top: 8px; }
.about ul { margin: 4px 0 0; padding-left: 16px; }
.about li { margin-bottom: 3px; }
.about code { font-family: var(--mono); font-size: 10px; background: var(--code-bg); padding: 1px 4px; border-radius: 4px; }
.about .muted { margin-top: 14px; font-size: 10.5px; }
.field input[type="text"] { width: 100%; height: 38px; border: 1px solid var(--line); border-radius: 9px; background: var(--surface); padding: 0 10px; font-size: 12px; }
.field input[type="text"]:focus { border-color: var(--accent); outline: none; }
.field > span { font-size: 10px; color: var(--text-3); margin-bottom: 2px; }

.palette-mask {
  position: fixed; inset: 0; z-index: 100; background: var(--mask);
  -webkit-backdrop-filter: blur(4px); backdrop-filter: blur(4px);
  display: flex; justify-content: center; align-items: flex-start;
  padding: 12vh 16px 16px; opacity: 0; transition: opacity .16s ease;
}
.palette-mask.on { opacity: 1; }
.palette {
  width: 560px; max-width: 100%; max-height: 66vh; display: flex; flex-direction: column;
  background: var(--surface); border: 1px solid var(--line); border-radius: 16px;
  box-shadow: var(--sh-3); overflow: hidden; transform: translateY(-6px) scale(.99);
  transition: transform .2s var(--ease);
}
.palette-mask.on .palette { transform: none; }
.palette-input { display: flex; align-items: center; gap: 9px; padding: 0 13px; height: 48px; border-bottom: 1px solid var(--line); }
.palette-input .ic { color: var(--text-3); width: 16px; height: 16px; }
.palette-input input { flex: 1; border: 0; outline: none; background: none; font-size: 13px; color: var(--text); min-width: 0; }
.palette-input input::placeholder { color: var(--text-3); }
.palette-input kbd { font-size: 9px; color: var(--text-3); border: 1px solid var(--line); border-radius: 5px; padding: 1px 5px; font-family: var(--mono); }
.palette-list { overflow: auto; padding: 6px; flex: 1; }
.palette-group { font-size: 9px; color: var(--text-3); padding: 8px 9px 4px; letter-spacing: .04em; }
.palette-item { display: flex; align-items: center; gap: 9px; width: 100%; text-align: left; padding: 8px 9px; border-radius: 9px; }
.palette-item.on { background: var(--surface-2); }
.pi-ic { width: 24px; height: 24px; border-radius: 7px; display: grid; place-items: center; background: var(--surface-2); color: var(--text-2); flex: none; }
.pi-ic .ic { width: 13px; height: 13px; }
.pi-label { flex: 1; font-size: 11.5px; }
.pi-hint { font-size: 9px; color: var(--text-3); }
.palette-empty { padding: 22px; text-align: center; color: var(--text-3); font-size: 11px; }
.palette-foot { display: flex; gap: 16px; padding: 8px 13px; border-top: 1px solid var(--line); font-size: 9px; color: var(--text-3); }
.palette-foot span { display: inline-flex; align-items: center; gap: 3px; }
.palette-foot kbd { font-family: var(--mono); background: var(--surface-2); border: 1px solid var(--line); border-radius: 4px; padding: 0 4px; }

#tooltip {
  position: fixed; z-index: 120; pointer-events: none;
  background: var(--tip-bg); color: var(--tip-text); border: 1px solid var(--tip-border);
  border-radius: 9px; padding: 8px 10px; font-size: 10.5px; line-height: 1.55;
  box-shadow: 0 16px 40px -18px rgba(0, 0, 0, .5);
  opacity: 0; transform: translateY(3px); transition: opacity .1s ease, transform .1s ease;
  max-width: 280px;
}
#tooltip.on { opacity: 1; transform: none; }
.tip-h { font-size: 9.5px; color: color-mix(in srgb, var(--tip-text) 62%, transparent); margin-bottom: 4px; }
.tip-row { display: flex; align-items: center; gap: 6px; min-height: 17px; }
.tip-row i { width: 6px; height: 6px; border-radius: 2px; flex: none; }
.tip-row span { color: color-mix(in srgb, var(--tip-text) 72%, transparent); flex: 1; }
.tip-row b { font-weight: 600; font-variant-numeric: tabular-nums; }

.toast {
  position: fixed; left: 50%; bottom: 24px; z-index: 130; transform: translate(-50%, 10px);
  display: flex; align-items: center; gap: 7px;
  background: var(--text); color: var(--bg); border-radius: 10px; padding: 9px 13px;
  font-size: 11.5px; box-shadow: var(--sh-3); opacity: 0; pointer-events: none;
  transition: opacity .18s ease, transform .22s var(--ease); max-width: calc(100vw - 32px);
}
.toast.on { opacity: 1; transform: translate(-50%, 0); }
.toast .ic { width: 14px; height: 14px; }
.toast.warn { background: var(--red); color: #fff; }
.toast.ok { background: var(--text); color: var(--bg); }

/* ------------------------------- 7. 动画 -------------------------------- */
@keyframes pageIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
@keyframes rise { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
@keyframes growX { from { width: 0; } to { width: var(--w); } }
@keyframes fadeIn { from { opacity: 0; } to { opacity: var(--o, 1); } }
@keyframes pulse { 0%, 100% { box-shadow: 0 0 0 3px var(--green-soft); } 50% { box-shadow: 0 0 0 5px transparent; } }
.rise { animation: rise .48s var(--ease) backwards; animation-delay: var(--d, 0ms); }
.page.soft .rise { animation: none; }
.c-bar { transform-box: fill-box; transform-origin: bottom; transform: scaleY(0); }
.c-bar.in { transform: none; }

/* ------------------------------- 8. 响应式 ------------------------------ */
@media (max-width: 1280px) {
  :root { --maxw: 1240px; }
  main { padding: 22px 22px 44px; }
  .topbar { padding: 0 22px; }
  .pagefoot { padding: 0 22px 28px; }
  .split { grid-template-columns: minmax(0, 1.7fr) minmax(0, 1fr); }
  .search-trigger { width: 40px; padding: 0; justify-content: center; }
  .search-trigger span, .search-trigger kbd { display: none; }
}

@media (max-width: 1120px) {
  .kpi-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .split { grid-template-columns: 1fr; }
  .ex-layout { grid-template-columns: 260px minmax(0, 1fr); }
  .stat-band .sb { padding: 12px 14px; }
  .sb b { font-size: 20px; }
  .life-grid { grid-template-columns: repeat(3, minmax(0, 1fr)); row-gap: 12px; }
  .life-item:nth-child(4) { border-left: 0; padding-left: 0; }
  .life-item:nth-child(4), .life-item:nth-child(5) { margin-top: 4px; }
  .perf-hero { grid-template-columns: 1fr; gap: 16px; }
  .ph-stats { border-top: 1px solid var(--line); padding-top: 4px; }
  .ph-stats > div { padding: 10px 0 10px 16px; }
}

@media (max-width: 900px) {
  .rail { display: none; }
  .mainwrap { margin-left: 0; }
  .mtabs { display: grid; }
  main { padding: 20px 18px 92px; }
  .topbar { padding: 0 18px; }
  .pagefoot { padding: 0 18px 82px; }
  .only-mobile { display: grid; }
  .rail-collapse { display: none; }
  .search-trigger { display: none; }
  .only-desktop { display: none !important; }
  .tag-compare, .tag-export { display: none; }
  .insight-rail { grid-template-columns: repeat(3, minmax(220px, 1fr)); overflow-x: auto; padding-bottom: 2px; scrollbar-width: none; }
  .insight-rail::-webkit-scrollbar { display: none; }
  .ex-side { position: static; }
  .ex-layout { grid-template-columns: 1fr; }
  .ex-side .builder .card-body { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; align-items: end; }
  .ex-side .builder .setting-note, .ex-side .builder-actions { grid-column: 1 / -1; }
  .ex-side .builder .card-head { grid-column: 1 / -1; }
}

@media (max-width: 760px) {
  :root { --topbar-h: 56px; }
  main { padding: 16px 14px 88px; }
  .topbar { padding: 0 12px; gap: 8px; }
  .tb-titles h1 { font-size: 17px; }
  .tb-titles p { display: none; }
  .tb-right { gap: 2px; }
  .topbar .divider { display: none; }
  .range-trigger { padding: 0 8px; height: 32px; }
  .range-trigger .ic:first-child { display: none; }
  .icon-btn { width: 32px; height: 32px; }
  .pagefoot { display: none; }
  .card-head { padding: 14px 14px 0; }
  .card-body { padding: 13px 14px 15px; }
  .card-foot { padding: 9px 14px 12px; }
  .card-head h2 { font-size: 13.5px; }
  .kpi-grid { gap: 9px; }
  .kpi { padding: 13px 13px 12px; }
  .kpi-value { font-size: 26px; }
  .kpi-hint { display: none; }
  .kpi-foot { min-height: 26px; }
  .spark { width: 72px; height: 26px; }
  .insight-rail { grid-template-columns: 1fr; gap: 8px; overflow: visible; padding-bottom: 0; scroll-snap-type: none; }
  .insight { padding: 10px 12px; min-width: 0; scroll-snap-align: none; }
  .insight p { font-size: 11.5px; }
  .g-2 { grid-template-columns: 1fr; }
  .masonry { column-count: 1; }
  .donut-split { grid-template-columns: 150px minmax(0, 1fr); gap: 10px; }
  .donut-split .chart-host { height: 150px !important; }
  .heat { height: 72px; gap: 2px; }
  .life-grid { grid-template-columns: 1fr 1fr; }
  .life-item { padding: 0 10px; }
  .life-item:nth-child(odd) { border-left: 0; padding-left: 0; }
  .life-item:nth-child(n+3) { margin-top: 8px; }
  .stat-band { grid-template-columns: 1fr 1fr; }
  .stat-band .sb:nth-child(3) { border-left: 0; border-top: 1px solid var(--line); }
  .stat-band .sb:nth-child(4) { border-top: 1px solid var(--line); }
  .sb b { font-size: 19px; }
  .page-tabs { width: 100%; }
  .page-tabs button { flex: 1; padding: 0 8px; font-size: 11px; }
  .donut-pair { gap: 12px; }
  .donut-pair .chart-host { height: 132px !important; }
  .studio-bar { padding: 8px 14px 0; }
  .mchips { overflow-x: auto; flex-wrap: nowrap; scrollbar-width: none; padding-bottom: 2px; margin-right: -14px; padding-right: 14px; }
  .mchips::-webkit-scrollbar { display: none; }
  .studio-tools { width: 100%; justify-content: space-between; }
  .seg.hide-sm { display: none; }
  .readout { padding: 6px 14px 0; gap: 14px; }
  .ro b { font-size: 17px; }
  .studio-body { padding-top: 6px; }
  .ptable-head, .prow { grid-template-columns: minmax(96px, 1fr) 56px 84px 54px 14px; gap: 8px; padding: 0 14px; }
  .ptable-head span:nth-child(4), .prow .pspark { display: none; }
  .ptable-head span:nth-child(2) { text-align: right; }
  .prow { height: 41px; }
  .perf-hero { padding: 16px 14px; }
  .ph-value > b { font-size: 38px; }
  .ph-value > em { width: 100%; margin-left: 0; margin-top: 2px; }
  .ps-labels { font-size: 8px; }
  .stack-row { grid-template-columns: minmax(0, 1fr) auto; gap: 5px 8px; align-items: center; }
  .sr-bar { grid-column: 1 / -1; grid-row: 2; height: 20px; }
  .sr-avg { grid-row: 1; grid-column: 2; }
  .sr-bar { height: 20px; }
  .sr-bar .seg span { display: none; }
  .ex-hero { flex-direction: column; align-items: flex-start; gap: 12px; }
  .ex-hero-tag { align-self: stretch; }
  .ex-side .builder .card-body { display: flex; }
  .ex-donut { grid-template-columns: 1fr; gap: 6px; }
  .ex-donut .chart-host { height: 200px !important; }
  .share-legend { grid-template-columns: 1fr; }
  .preview .card-body { min-height: 220px; }
  .saved-empty { justify-content: flex-start; }
  .sheet.right { top: auto; left: 0; right: 0; bottom: 0; width: auto; max-height: 88dvh; border-radius: 18px 18px 0 0; transform: translateY(22px); border-bottom: 0; }
  .sheet.right.on { transform: none; }
  .sheet-head { padding: 15px 16px 11px; }
  .palette-mask { padding: 8vh 10px 10px; }
  .palette { max-height: 72vh; }
  .toast { bottom: calc(68px + env(safe-area-inset-bottom)); }
  .pop { max-width: calc(100vw - 20px); }
  .donut-split .donut-legend { font-size: 10px; }
}

@media (max-width: 620px) {
  /* 窄屏表格：收起次要列，避免横向滚动打断阅读 */

<script>/* ==========================================================================
   00 · 首屏数据适配层（服务端内联注入 → 页面数据模型）
   口径与 cloudflare/summary.js 一致：北京时间日/小时键、设备维度累计、
   页面打开数、渲染耗时 5 档、历史条数 61 组。此处不再生成任何本地假数据。
   ========================================================================== */
(function () {
  'use strict';
  const TEL = (window.TEL = window.TEL || {});

  /* ------------------------------- 基础工具 ------------------------------- */
  const DAY = 86400000;

  function pad(n) { return String(n).padStart(2, '0'); }
  function dayKey(d) { return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()); }
  function parseDay(key) {
    const p = String(key).split('-').map(Number);
    return new Date(p[0], (p[1] || 1) - 1, p[2] || 1);
  }
  function addDays(d, n) { return new Date(d.getFullYear(), d.getMonth(), d.getDate() + n); }
  function diffDays(a, b) { return Math.round((parseDay(b) - parseDay(a)) / DAY); }
  function clamp(v, min, max) { return Math.max(min, Math.min(max, v)); }
  function num(v) { const n = Number(v); return Number.isFinite(n) ? n : 0; }

  const PAGE_KEYS = ['overview', 'stats', 'history', 'forecast', 'wallet', 'settings', 'help', 'about'];
  const PAGE_LABELS = {
    overview: '用量概览', stats: '用量统计', history: '历史记录', forecast: '趋势预测',
    wallet: '钱包', settings: '设置', help: '使用说明', about: '关于',
  };
  const RENDER_TIERS = 5;
  // 小时增长查找在 buildData 内部构建，这里留一个模块级引用供 TEL.util.growthAt 转发
  let growthLookup = () => null;

  /* ------------------------------ 首屏载荷 ------------------------------- */
  const BOOT = window.__TEL_BOOT__ && typeof window.__TEL_BOOT__ === 'object' ? window.__TEL_BOOT__ : null;
  const OFFLINE = !BOOT;
  const BUILD_META = document.querySelector('meta[name="tel-build"]');
  const BUILD = (BUILD_META && BUILD_META.getAttribute('content')) || 'dev';

  function offlineBoot() {
    const today = dayKey(new Date());
    return {
      generatedAt: Date.now(), today, startDay: today, endDay: today, pageKeys: PAGE_KEYS,
      dailyFrom: today, dailyTo: today, hourlyFrom: null, hourlyTo: null,
      renderFrom: today, renderTo: today,
      summary: { totals: {}, userGrowth: [], pages: {}, historyCount: [], versions: [], env: {}, durationHistogram: [] },
      daily: [], hourly: [], hourlyGrowth: [], render: [],
    };
  }

  /* ------------------------------ 版本号口径 ------------------------------ */
  // 服务端 app_version 不带前缀（3.1.7），页面按 v3.1.7 展示；空值与 unknown 统一为「未知」
  function versionLabel(value) {
    const text = String(value === null || value === undefined ? '' : value).trim();
    if (!text || text.toLowerCase() === 'unknown' || text === '未知') return '未知';
    return /^v/i.test(text) ? text : 'v' + text;
  }

  function renderRows(list) {
    const items = (Array.isArray(list) ? list : []).map((row) => {
      const buckets = Array.isArray(row && row.buckets) ? row.buckets : [];
      const tiers = [];
      for (let i = 0; i < RENDER_TIERS; i++) tiers.push(num(buckets[i]));
      const avgMs = row && row.avgMs !== null && row.avgMs !== undefined && Number.isFinite(Number(row.avgMs))

  function buildData(boot) {

      if (!hour) return null;

      let found = -1;

    });

      meta: {

        endDay: today,

        build: BUILD,

        label: String(item && item.label), count: num(item && item.count),

        TEL.data.renderByVersion = renderRows(rows);
        TEL.data.meta.renderWindow = { from: range.from, to: range.to };

      } catch (error) {

    },

    const peak = hours.slice().sort((a, b) => b.devices - a.devices)[0];

    const renderRows = D.renderByVersion.filter((r) => r.avgMs !== null && r.samples > 0);
    const slowest = renderRows[0];

    if (topVersion && slowest && fastest && slowest !== fastest) {

    }

  }

  if (state.chart.metrics.length > 3) state.chart.metrics = state.chart.metrics.slice(0, 3);

  /* -------------------------------- 导出 -------------------------------- */
  const core = {

    insights,

  TEL.core = core;
})();

            'text-anchor': anchor, fill: token('--text-3'), 'font-size': fsX,
          }));
        }
      });
      svg.appendChild(xG);
    }

    /* 系列 */
    const plot = el('g', { 'clip-path': 'url(#' + clipId + ')' });
    const dotsG = el('g');
    const anim = animate !== false && !reduceMotion;

    const barSeries = series.filter((s) => (s.type || (isBar ? 'bar' : 'line')) === 'bar');
    const barWidth = Math.min(width < 480 ? 26 : 44, (band || step || pw / n) * (barSeries.length > 1 ? 0.66 / barSeries.length : 0.62));

    series.forEach((s, si) => {
      const color = token(s.color || '--chart-1');
      const type = s.type || (isBar ? 'bar' : 'line');
      const values = s.values.map((v) => (v === null || v === undefined || !Number.isFinite(Number(v)) ? null : Number(v)));
      const axis = s.axis === 1 ? y2At : yAt;

      if (type === 'bar') {
        const sameAxisBars = barSeries.filter((x) => (x.axis === 1) === (s.axis === 1));
        const bi = sameAxisBars.indexOf(s);
        const bw = Math.max(3, barWidth);
        const offset = (bi - (sameAxisBars.length - 1) / 2) * (bw + 2);
        const g = el('g');
        values.forEach((v, i) => {
          if (v === null) return;
          const x = xAt(i) + offset - bw / 2;
          const y = axis(v);
          const h = Math.max(0.5, pad.t + ph - y);
          const rect = el('rect', {
            x, y, width: bw, height: h, rx: Math.min(4, bw / 2), fill: color,
            class: 'c-bar', opacity: s.opacity || 1,
          });
          rect.style.setProperty('--i', i);
          g.appendChild(rect);
        });
        plot.appendChild(g);
      } else {
        if (type === 'area' && !s.dashed) {
          const gid = 'grad' + (++uid);
          const grad = el('linearGradient', { id: gid, x1: '0', y1: '0', x2: '0', y2: '1' });
          grad.appendChild(el('stop', { offset: '0%', 'stop-color': color, 'stop-opacity': s.areaOpacity || 0.20 }));
          grad.appendChild(el('stop', { offset: '100%', 'stop-color': color, 'stop-opacity': 0 }));
          defs.appendChild(grad);
          // 面积按连续段绘制
          let seg = [];
          const flush = () => {
            if (seg.length > 1) {
              const line = smoothPath(seg);
              const area = line + 'L' + seg[seg.length - 1][0] + ' ' + (pad.t + ph) + 'L' + seg[0][0] + ' ' + (pad.t + ph) + 'Z';
              const p = el('path', { d: area, fill: 'url(#' + gid + ')', class: 'c-area' });
              plot.appendChild(p);
            }
            seg = [];
          };
          values.forEach((v, i) => { if (v === null) flush(); else seg.push([xAt(i), axis(v)]); });
          flush();
        }

        let seg = [];
        const paths = [];
        const flushLine = () => {
          if (seg.length > 1) {
            const d = cfg.smooth && !s.dashed ? smoothPath(seg) : seg.map((p, i) => (i ? 'L' : 'M') + p[0] + ' ' + p[1]).join(' ');
            const p = el('path', {
              d, fill: 'none', stroke: color, 'stroke-width': s.width || (s.dashed ? 1.6 : 2.2),
              'stroke-linecap': 'round', 'stroke-linejoin': 'round',
              'stroke-dasharray': s.dashed ? '4 4' : undefined, opacity: s.dashed ? 0.7 : 1,
              class: 'c-line',
            });
            plot.appendChild(p);
            paths.push(p);
          }
          seg = [];
        };
        values.forEach((v, i) => { if (v === null) flushLine(); else seg.push([xAt(i), axis(v)]); });
        flushLine();

        if (anim) {
          paths.forEach((p) => {
            try {
              const len = p.getTotalLength();
              p.style.strokeDasharray = s.dashed ? '4 4' : String(len);
              p.style.strokeDashoffset = s.dashed ? '0' : String(len);
              p.style.transition = 'stroke-dashoffset .9s cubic-bezier(.22,1,.36,1)';
              requestAnimationFrame(() => { p.style.strokeDashoffset = '0'; });
            } catch (e) {}
          });
        }

        if (cfg.dots || s.dots) {
          values.forEach((v, i) => {
            if (v === null) return;
            const c = el('circle', {
              cx: xAt(i), cy: axis(v), r: cfg.dots ? (n > 60 ? 1.8 : 2.6) : 2,
              fill: token('--surface'), stroke: color, 'stroke-width': 1.6, class: 'c-dot',
              opacity: 0,
            });
            c.style.transition = 'opacity .4s ease ' + Math.min(600, i * 6) + 'ms';
            dotsG.appendChild(c);
            requestAnimationFrame(() => { c.setAttribute('opacity', s.dashed ? 0.6 : 1); });
          });
        }
      }
    });
    svg.appendChild(plot);
    svg.appendChild(dotsG);

    /* 交互层 */
    const hit = el('rect', {
      x: pad.l, y: pad.t, width: pw, height: ph, fill: 'transparent', class: 'c-hit',
      style: 'cursor:crosshair',
    });
    svg.appendChild(hit);
    const hoverG = el('g', { opacity: 0, 'pointer-events': 'none' });
    const cross = el('line', {
      y1: pad.t, y2: pad.t + ph, stroke: token('--text-3'), 'stroke-width': 1,
      'stroke-dasharray': '3 3', opacity: 0.55,
    });
    hoverG.appendChild(cross);
    const hoverDots = el('g');
    hoverG.appendChild(hoverDots);
    svg.appendChild(hoverG);

    function showAt(i, clientX, clientY, touch) {
      i = Math.max(0, Math.min(n - 1, i));
      const x = xAt(i);
      cross.setAttribute('x1', x);
      cross.setAttribute('x2', x);
      while (hoverDots.firstChild) hoverDots.removeChild(hoverDots.firstChild);
      series.forEach((s) => {
        const v = s.values[i];
        if (v === null || v === undefined || !Number.isFinite(Number(v))) return;
        hoverDots.appendChild(el('circle', {
          cx: x, cy: (s.axis === 1 ? y2At : yAt)(v), r: 3.4,
          fill: token('--surface'), stroke: token(s.color || '--chart-1'), 'stroke-width': 2,
        }));
      });
      hoverG.setAttribute('opacity', 1);
      const rows = series.map((s) => {
        const v = s.values[i];
        if (v === null || v === undefined || !Number.isFinite(Number(v))) return '';
        const f = s.fmt || cfg.yFormat || axisFmt;
        return '<div class="tip-row"><i style="background:' + token(s.color || '--chart-1') + '"></i>'
          + '<span>' + TEL.ui.esc(s.name) + '</span><b>' + TEL.ui.esc(f(v)) + '</b></div>';
      }).join('');
      const label = (cfg.tipFormat ? cfg.tipFormat(labels[i], i) : labels[i]) || '';
      TEL.ui.tip.show('<div class="tip-h">' + TEL.ui.esc(label) + '</div>' + rows, clientX, clientY, touch ? { touch: true } : null);
    }
    function hide() {
      hoverG.setAttribute('opacity', 0);
      TEL.ui.tip.hide();
    }
    function indexFromEvent(e) {
      const rect = svg.getBoundingClientRect();
      const x = e.clientX - rect.left;
      if (isBar) return Math.floor((x - pad.l) / band);
      return Math.round((x - pad.l) / (step || 1));
    }
    /* 触屏：按下先不定夺方向——横向拖动逐点读数，纵向拖动自己接管滚动，轻点看读数。
       状态与监听都挂在 host 上且只绑一次：重绘只换 IH.api，
       否则每重绘一次就多叠一套监听，一次移动会滚 N 次，页面看着"飞快"。 */
    const IH = host._ih || (host._ih = {
      dragId: null, hideTimer: null, mode: null,

    const live = () => IH.api || { showAt, hide, indexFromEvent };
    const scroller = () => document.scrollingElement || document.documentElement;
    function stopFly() {
      if (IH.flyId) { cancelAnimationFrame(IH.flyId); IH.flyId = 0; }
    }
    function fling(v) {
      let last = performance.now();
      const step = (now) => {
        const dt = Math.min(48, Math.max(8, now - last));
        last = now;
        v *= Math.pow(0.94, dt / 16);
        if (Math.abs(v) < 0.03) { IH.flyId = 0; return; }
        scroller().scrollTop -= v * dt;
        IH.flyId = requestAnimationFrame(step);
      };
      stopFly();
      IH.flyId = requestAnimationFrame(step);
    }
    function beginTouch(e) {
      IH.dragId = e.pointerId;
      IH.mode = null;
      IH.startX = e.clientX;
      IH.startY = e.clientY;
      IH.prevY = e.clientY;
      IH.prevT = performance.now();
      IH.velocity = 0;
      stopFly();
      clearTimeout(IH.hideTimer);

      const mode = IH.mode;
      IH.dragId = null;
      IH.mode = null;

      if (mode === 'scroll') {
        if (Math.abs(IH.velocity) > 0.12) fling(IH.velocity);
        return;
      }
      if (mode === null) {
        const a = live();
        a.showAt(a.indexFromEvent(e), e.clientX, e.clientY, true);
      }
      clearTimeout(IH.hideTimer);
      IH.hideTimer = setTimeout(() => live().hide(), 2400);
    }
    if (!host._ihBound) {
      host._ihBound = true;
      host.addEventListener('pointerdown', (e) => {
        if (e.pointerType === 'touch') {
          beginTouch(e);
          if (host.setPointerCapture) {
            try { host.setPointerCapture(e.pointerId); } catch (err) { /* 忽略 */ }
          }
          return;
        }
        clearTimeout(IH.hideTimer);
        const a = live();
        a.showAt(a.indexFromEvent(e), e.clientX, e.clientY, false);
      });
      host.addEventListener('pointermove', (e) => {
        if (e.pointerType !== 'touch') {
          const a = live();
          a.showAt(a.indexFromEvent(e), e.clientX, e.clientY, false);
          return;
        }
        if (e.pointerId !== IH.dragId) return;
        if (!IH.mode) {
          const dx = Math.abs(e.clientX - IH.startX);
          const dy = Math.abs(e.clientY - IH.startY);
          if (Math.max(dx, dy) < 6) return;
          IH.mode = dx >= dy ? 'scrub' : 'scroll';
          if (IH.mode === 'scroll') live().hide();
        }
        if (IH.mode === 'scroll') {
          const now = performance.now();
          const dt = Math.max(8, now - IH.prevT);
          const step = e.clientY - IH.prevY;
          IH.prevY = e.clientY;
          IH.prevT = now;
          IH.velocity = IH.velocity * 0.7 + (step / dt) * 0.3;
          scroller().scrollTop -= step;
          return;
        }
        clearTimeout(IH.hideTimer);
        const a = live();
        a.showAt(a.indexFromEvent(e), e.clientX, e.clientY, true);
      });
      host.addEventListener('pointerup', endTouch);
      host.addEventListener('pointercancel', endTouch);
      host.addEventListener('pointerleave', (e) => {
        if (e.pointerType === 'touch') return;
        live().hide();
      });
    }

    host.appendChild(svg);
    if (anim) {
      svg.classList.add('anim');
      requestAnimationFrame(() => {
        svg.querySelectorAll('.c-bar').forEach((b) => {
          b.style.transition = 'transform .65s cubic-bezier(.22,1,.36,1) ' + (Number(b.style.getPropertyValue('--i')) || 0) * 12 + 'ms';
          b.classList.add('in');
        });
      });
    }
  }

  /* -------------------------------- 环形图 -------------------------------- */
  function renderDonut(host, cfg, animate) {
    if (!host) return;
    const width = host.clientWidth;
    const height = host.clientHeight;
    if (!width || !height) return;
    clear(host);
    const items = (cfg.items || []).filter((x) => x.value > 0);
    if (!items.length) {
      const empty = document.createElement('div');
      empty.className = 'chart-empty';
      empty.textContent = '暂无数据';
      host.appendChild(empty);
      return;
    }
    const size = Math.min(width, height);
    const cx = width / 2;
    const cy = height / 2;
    const stroke = Math.max(16, size * 0.16);
    const r = Math.max(20, size / 2 - stroke / 2 - 6);
    const C = 2 * Math.PI * r;
    const total = items.reduce((s, x) => s + x.value, 0) || 1;
    const svg = el('svg', { width: '100%', height: '100%', viewBox: '0 0 ' + width + ' ' + height, role: 'img', 'aria-label': cfg.aria || '占比环形图' });
    const g = el('g', { transform: 'rotate(-90 ' + cx + ' ' + cy + ')' });
    let offset = 0;
    const animOn = animate !== false && !reduceMotion;

    items.forEach((item, i) => {
      const len = (item.value / total) * C;
      const gap = Math.min(2.4, len * 0.06);
      const circle = el('circle', {
        cx, cy, r, fill: 'none', stroke: token(item.color || ('--chart-' + ((i % 8) + 1))),
        'stroke-width': stroke, 'stroke-linecap': 'butt',
        'stroke-dasharray': Math.max(0.1, len - gap) + ' ' + C,
        'stroke-dashoffset': -offset,
        class: 'c-arc',
      });
      circle.style.transition = 'stroke-width .16s ease, opacity .16s ease';
      let arcTouch = false;
      circle.addEventListener('pointerenter', (e) => {
        arcTouch = e.pointerType === 'touch';
        circle.setAttribute('stroke-width', stroke + 3);
        TEL.ui.tip.show(
          '<div class="tip-h">' + TEL.ui.esc(item.label) + '</div>'
          + '<div class="tip-row"><i style="background:' + token(item.color || ('--chart-' + ((i % 8) + 1))) + '"></i><span>数量</span><b>' + TEL.ui.esc(TEL.core.fmtInt(item.value)) + '</b></div>'
          + '<div class="tip-row"><i style="background:transparent"></i><span>占比</span><b>' + TEL.ui.esc(TEL.core.fmtPct(item.value / total)) + '</b></div>',
          e.clientX, e.clientY, arcTouch ? { touch: true } : null,
        );
      });
      circle.addEventListener('pointermove', (e) => TEL.ui.tip.move(e.clientX, e.clientY));
      circle.addEventListener('pointerleave', () => {
        circle.setAttribute('stroke-width', stroke);
        if (arcTouch) TEL.ui.tip.hideSoon(1500);
        else TEL.ui.tip.hide();
      });
      if (animOn) {
        circle.style.strokeDasharray = '0 ' + C;
        setTimeout(() => {
          circle.style.transition = 'stroke-dasharray .85s cubic-bezier(.22,1,.36,1) ' + i * 60 + 'ms';
          circle.style.strokeDasharray = Math.max(0.1, len - gap) + ' ' + C;
        }, 30);
      }
      g.appendChild(circle);
      offset += len;
    });
    svg.appendChild(g);

    if (cfg.value !== undefined) {
      const v = el('text', {
        x: cx, y: cy - 2, 'text-anchor': 'middle', fill: token('--text'),
        'font-size': Math.max(17, Math.min(26, size * 0.13)), 'font-weight': '650', 'letter-spacing': '-.02em',
      });
      v.textContent = cfg.value;
      svg.appendChild(v);
      const l = el('text', {
        x: cx, y: cy + 16, 'text-anchor': 'middle', fill: token('--text-3'), 'font-size': 10.5,
      });
      l.textContent = cfg.label || '合计';
      svg.appendChild(l);
    }
    host.appendChild(svg);
  }

  /* -------------------------------- 迷你图 -------------------------------- */
  function renderSpark(host, values, color, opts) {
    if (!host) return;
    const width = host.clientWidth || 96;
    const height = host.clientHeight || 30;
    clear(host);
    const vals = (values || []).map(Number).filter((v) => Number.isFinite(v));
    if (vals.length < 2) {
      const d = el('div', { class: 'spark-empty' });
      host.appendChild(d);
      return;
    }
    const pad = 3;
    const min = Math.min(...vals);
    const max = Math.max(...vals);
    const span = max - min || 1;
    const step = (width - pad * 2) / (vals.length - 1);
    const pts = vals.map((v, i) => [pad + i * step, height - pad - ((v - min) / span) * (height - pad * 2)]);
    const line = smoothPath(pts);
    const svg = el('svg', { width: '100%', height: '100%', viewBox: '0 0 ' + width + ' ' + height, 'aria-hidden': 'true' });
    const gid = 'sg' + (++uid);
    const defs = el('defs');
    const grad = el('linearGradient', { id: gid, x1: '0', y1: '0', x2: '0', y2: '1' });
    grad.appendChild(el('stop', { offset: '0%', 'stop-color': token(color), 'stop-opacity': 0.22 }));
    grad.appendChild(el('stop', { offset: '100%', 'stop-color': token(color), 'stop-opacity': 0 }));
    defs.appendChild(grad);
    svg.appendChild(defs);
    svg.appendChild(el('path', {
      d: line + 'L' + pts[pts.length - 1][0] + ' ' + height + 'L' + pts[0][0] + ' ' + height + 'Z',
      fill: 'url(#' + gid + ')', stroke: 'none',
    }));
    const path = el('path', { d: line, fill: 'none', stroke: token(color), 'stroke-width': 1.6, 'stroke-linecap': 'round', 'stroke-linejoin': 'round' });
    svg.appendChild(path);
    const last = pts[pts.length - 1];
    svg.appendChild(el('circle', { cx: last[0], cy: last[1], r: 2.2, fill: token('--surface'), stroke: token(color), 'stroke-width': 1.4 }));
    host.appendChild(svg);
    if (!reduceMotion && opts && opts.animate !== false) {
      try {
        const len = path.getTotalLength();
        path.style.strokeDasharray = String(len);
        path.style.strokeDashoffset = String(len);
        path.style.transition = 'stroke-dashoffset .8s cubic-bezier(.22,1,.36,1)';
        requestAnimationFrame(() => { path.style.strokeDashoffset = '0'; });
      } catch (e) {}
    }
  }

  /* -------------------------------- 生命周期 ------------------------------ */
  const ro = typeof ResizeObserver === 'function' ? new ResizeObserver((entries) => {
    for (const entry of entries) {
      const host = entry.target;
      if (!host || !host._cfg) continue;
      const w = host.clientWidth;
      if (!w || Math.abs((host._w || 0) - w) < 2) continue;
      if (host._kind === 'donut') renderDonut(host, host._cfg, false);
      else renderTrend(host, host._cfg, false);
    }
  }) : null;

  function mount(root) {
    if (!ro) return;
    (root || document).querySelectorAll('.chart-host').forEach((host) => {
      if (host._observed) return;
      host._observed = true;
      ro.observe(host);
    });
  }

  function redrawAll() {
    document.querySelectorAll('.chart-host').forEach((host) => {
      if (!host._cfg) return;
      if (host._kind === 'donut') renderDonut(host, host._cfg, false);
      else renderTrend(host, host._cfg, false);
    });
  }

  function donut(host, cfg) {
    host._kind = 'donut';
    host._cfg = cfg;
    renderDonut(host, cfg, true);
  }

  TEL.charts = {
    trend: renderTrend,
    donut,
    spark: renderSpark,
    mount,
    redrawAll,
    token,
    axisFmt,
    niceTicks,
    reduceMotion,
  };
})();


/* ==========================================================================
   03 · 外壳：路由、主题、区间、弹层、命令面板、导出
   ========================================================================== */
(function () {
  'use strict';
  const TEL = (window.TEL = window.TEL || {});
  const $ = (sel, root) => (root || document).querySelector(sel);
  const $$ = (sel, root) => Array.prototype.slice.call((root || document).querySelectorAll(sel));
  const esc = (v) => String(v === null || v === undefined ? '' : v)
    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
  const icon = (name, cls) => '<svg class="ic ' + (cls || '') + '" aria-hidden="true"><use href="#i-' + name + '"></use></svg>';

  /* -------------------------------- 提示条 -------------------------------- */
  let toastTimer = null;
  function toast(message, kind) {
    let node = $('#toast');
    if (!node) {
      node = document.createElement('div');
      node.id = 'toast';
      node.className = 'toast';
      node.setAttribute('role', 'status');
      node.setAttribute('aria-live', 'polite');
      document.body.appendChild(node);
    }
    node.innerHTML = (kind === 'ok' ? icon('check') : kind === 'warn' ? icon('info') : '') + '<span>' + esc(message) + '</span>';
    node.className = 'toast on' + (kind ? ' ' + kind : '');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => { node.classList.remove('on'); }, 2600);
  }

  /* -------------------------------- 图表提示 ------------------------------ */
  const tip = {
    node: null,
    touch: false,
    show(html, x, y, opts) {
      this.touch = !!(opts && opts.touch);
      clearTimeout(this._hideTimer);
      if (!this.node) this.node = $('#tooltip');
      if (!this.node) return;
      this.node.innerHTML = html;
      this.node.hidden = false;
      this.node.classList.add('on');
      this.move(x, y);
    },
    move(x, y) {

  /* -------------------------------- 复制 ---------------------------------- */
  function copy(text) {

  /* -------------------------------- 浮层 ---------------------------------- */

    }

      popAnchor.setAttribute('aria-expanded', 'false');
      popAnchor = null;
    }
    document.removeEventListener('keydown', popKey, true);
  }
  function popKey(e) { if (e.key === 'Escape') { e.stopPropagation(); closePopover(); } }

  function popover(anchor, html, opts) {
    const options = opts || {};
    closePopover();
    popAnchor = anchor;
    anchor.setAttribute('aria-expanded', 'true');
    popMask = document.createElement('div');
    popMask.className = 'pop-mask';
    popMask.addEventListener('pointerdown', closePopover);
    document.body.appendChild(popMask);

    popNode = document.createElement('div');
    popNode.className = 'pop' + (options.wide ? ' wide' : '');
    popNode.setAttribute('role', 'dialog');
    popNode.innerHTML = html;
    document.body.appendChild(popNode);

    const r = anchor.getBoundingClientRect();
    const w = popNode.offsetWidth;
    const h = popNode.offsetHeight;
    let left = options.align === 'left' ? r.left : r.right - w;
    left = Math.max(8, Math.min(left, window.innerWidth - w - 8));
    let top = r.bottom + 8;
    if (top + h > window.innerHeight - 8) top = Math.max(8, r.top - h - 8);
    popNode.style.left = left + 'px';
    popNode.style.top = top + 'px';
    requestAnimationFrame(() => popNode && popNode.classList.add('on'));
    document.addEventListener('keydown', popKey, true);
    return popNode;
  }

  /* -------------------------------- 抽屉 ---------------------------------- */
  function sheet(opts) {
    const mask = document.createElement('div');
    mask.className = 'sheet-mask';
    const panel = document.createElement('section');
    panel.className = 'sheet ' + (opts.side || 'right');
    panel.setAttribute('role', 'dialog');
    panel.setAttribute('aria-modal', 'true');
    panel.setAttribute('aria-label', opts.title || '面板');
    panel.innerHTML = '<header class="sheet-head"><div><h2>' + esc(opts.title || '') + '</h2>'
      + (opts.sub ? '<p>' + esc(opts.sub) + '</p>' : '') + '</div>'
      + '<button class="icon-btn" data-sheet-close aria-label="关闭">' + icon('x') + '</button></header>'
      + '<div class="sheet-body">' + (opts.body || '') + '</div>'
      + (opts.foot ? '<footer class="sheet-foot">' + opts.foot + '</footer>' : '');
    document.body.appendChild(mask);
    document.body.appendChild(panel);
    const prevFocus = document.activeElement;
    requestAnimationFrame(() => { mask.classList.add('on'); panel.classList.add('on'); });
    document.body.classList.add('sheet-open');

    function close() {
      mask.classList.remove('on');
      panel.classList.remove('on');
      document.body.classList.remove('sheet-open');
      document.removeEventListener('keydown', onKey, true);
      setTimeout(() => { mask.remove(); panel.remove(); }, 220);
      if (prevFocus && prevFocus.focus) prevFocus.focus({ preventScroll: true });
    }
    function onKey(e) {
      if (e.key === 'Escape') { e.preventDefault(); close(); return; }
      if (e.key !== 'Tab') return;
      const f = $$('button,[href],input,select,textarea,[tabindex]:not([tabindex="-1"])', panel)
        .filter((n) => !n.disabled && n.offsetParent !== null);
      if (!f.length) return;
      const first = f[0], last = f[f.length - 1];
      if (e.shiftKey && document.activeElement === first) { e.preventDefault(); last.focus(); }
      else if (!e.shiftKey && document.activeElement === last) { e.preventDefault(); first.focus(); }
    }
    mask.addEventListener('click', close);
    panel.querySelector('[data-sheet-close]').addEventListener('click', close);
    document.addEventListener('keydown', onKey, true);
    setTimeout(() => {
      const f = panel.querySelector('button:not([data-sheet-close]),input,select');
      if (f && f.focus) f.focus({ preventScroll: true });
    }, 60);
    return { close, panel };
  }

  /* -------------------------------- 导出 ---------------------------------- */
  function download(name, text, type) {
    const blob = new Blob([text], { type: type || 'text/csv;charset=utf-8' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = name;
    document.body.appendChild(a);
    a.click();
    setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 500);
  }
  function csvCell(v) {
    const s = String(v === null || v === undefined ? '' : v);
    return /[",\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s;
  }
  function toCSV(rows) {
    return '\ufeff' + rows.map((r) => r.map(csvCell).join(',')).join('\n');
  }
  function exportData() {
    const s = STATE;
    const c = TEL.core;
    let name = 'telemetry-' + s.view + '-' + s.range.from + '_' + s.range.to;
    let rows = [];
    if (s.view === 'trends') {
      const rowsD = c.daysIn(s.range);
      const metrics = s.chart.metrics;
      rows = [['日期'].concat(metrics.map((m) => c.METRICS[m].label))];
      rowsD.forEach((d) => {
        rows.push([d.day].concat(metrics.map((m) => {
          if (m === 'users') return d.devices;
          if (m === 'newUsers') return d.newUsers;
          if (m === 'opens') return d.opens;
          if (m === 'duration') return (d.durMs / 3600000).toFixed(2);
          if (m === 'views') return d.pageTotal;
          return d.cumulativeUsers;
        })));
      });
    } else if (s.view === 'audience') {
      const dim = s.audienceTab === 'device' ? 'os' : s.audienceTab === 'software' ? 'version' : 'themeMode';
      const d = c.dimensionItems(dim);
      rows = [['分类', '数量', '占比']].concat(d.items.map((x) => [x.label, x.count, (x.count / c.sum(d.items, (i) => i.count) * 100).toFixed(2) + '%']));
      name = 'telemetry-audience-' + dim;
    } else if (s.view === 'performance') {
      const r = c.weightedRender(s.range, s.granularity);
      rows = [['版本', '样本数', '估算平均耗时(ms)', '设备占比']].concat(r.rows.map((x) => [x.version, x.samples, x.avgMs, (x.deviceShare * 100).toFixed(1) + '%']));
    } else if (s.view === 'explore') {
      const d = c.explore(s.explore.dim, s.explore.topN, s.explore.sort);
      rows = [['分类', '数量', '占比']].concat(d.items.map((x) => [x.label, x.count, (x.share * 100).toFixed(2) + '%']));
      name = 'telemetry-explore-' + s.explore.dim;
    } else {
      rows = [['指标', '当前周期', '上一周期', '变化']].concat(c.kpis(s.range).map((k) => [k.label, k.display, '—', k.delta === null ? '—' : (k.delta * 100).toFixed(1) + '%']));
      rows.push([], ['累计指标', '数值'], ['不重复累计用户', c.lifetime().users], ['累计打开面板', c.lifetime().opens], ['累计使用时长(小时)', Math.round(c.lifetime().duration)], ['累计设备人均时长(小时)', (c.lifetime().avgDuration / 3600000).toFixed(2)]);
    }
    download(name + '.csv', toCSV(rows));
    toast('已导出 ' + rows.length + ' 行 CSV', 'ok');
  }
  function exportMenu(anchor) {
    const html = '<div class="pop-head">导出与分享</div>'
      + '<button class="menu-item" data-export="csv"><span class="menu-ic">' + icon('download') + '</span><span class="menu-txt"><b>导出当前视图 CSV</b><small>按当前时间范围</small></span></button>'
      + '<button class="menu-item" data-export="link"><span class="menu-ic">' + icon('link') + '</span><span class="menu-txt"><b>复制视图链接</b><small>含范围与图表设置</small></span></button>'
      + '<button class="menu-item" data-export="print"><span class="menu-ic">' + icon('printer') + '</span><span class="menu-txt"><b>打印 / 保存 PDF</b><small>自动隐藏导航</small></span></button>';

  /* -------------------------------- 快捷键 -------------------------------- */

  /* ------------------------------- 命令面板 ------------------------------- */
  let paletteNode = null;
  function openPalette() {
    if (paletteNode) return;
    const actions = [];
    const views = [['overview', '概览', 'grid'], ['trends', '趋势', 'trend'], ['audience', '用户', 'users'], ['performance', '性能', 'gauge'], ['explore', '自定义', 'sliders']];
    views.forEach(([key, label, ic]) => actions.push({ group: '前往', label, hint: '视图', icon: ic, run: () => route.navigate(key) }));
    [7, 30, 90, 365].forEach((n) => actions.push({ group: '时间范围', label: '最近 ' + n + ' 天', hint: '筛选', icon: 'calendar', run: () => setRange(TEL.core.presetRange(n)) }));
    actions.push({ group: '显示', label: '切换对比上一周期', hint: STATE.compare ? '已开启' : '已关闭', icon: 'compare', run: () => route.toggleCompare() });
    actions.push({ group: '显示', label: '浅色外观', hint: '主题', icon: 'sun', run: () => setTheme('light') });
    actions.push({ group: '显示', label: '深色外观', hint: '主题', icon: 'moon', run: () => setTheme('dark') });
    actions.push({ group: '显示', label: '跟随系统外观', hint: '主题', icon: 'monitor', run: () => setTheme('system') });
    actions.push({ group: '操作', label: '导出当前视图 CSV', hint: '导出', icon: 'download', run: exportData });
    actions.push({ group: '操作', label: '复制视图链接', hint: '分享', icon: 'link', run: () => copy(location.href).then((ok) => toast(ok ? '链接已复制' : '复制失败', ok ? 'ok' : 'warn')) });
    actions.push({ group: '操作', label: '刷新数据', hint: '同步', icon: 'refresh', run: () => route.refresh() });
    actions.push({ group: '帮助', label: '快捷键说明', hint: '帮助', icon: 'keyboard', run: shortcutsSheet });
    actions.push({ group: '帮助', label: '关于这份设计', hint: '说明', icon: 'info', run: () => route.about() });

    const mask = document.createElement('div');
    mask.className = 'palette-mask';
    mask.innerHTML = '<div class="palette" role="dialog" aria-modal="true" aria-label="命令面板">'
      + '<div class="palette-input">' + icon('search') + '<input type="text" placeholder="搜索视图、时间范围或操作…" aria-label="搜索命令"><kbd>ESC</kbd></div>'
      + '<div class="palette-list" role="listbox"></div>'
      + '<div class="palette-foot"><span><kbd>↑</kbd><kbd>↓</kbd> 选择</span><span><kbd>↵</kbd> 执行</span></div></div>';
    document.body.appendChild(mask);
    paletteNode = mask;
    const input = mask.querySelector('input');
    const list = mask.querySelector('.palette-list');
    let filtered = actions.slice();
    let active = 0;

    function draw() {
      const groups = {};
      filtered.forEach((a, i) => { (groups[a.group] = groups[a.group] || []).push({ a, i }); });
      let html = '';
      Object.keys(groups).forEach((g) => {
        html += '<div class="palette-group">' + esc(g) + '</div>';
        groups[g].forEach(({ a, i }) => {
          html += '<button class="palette-item' + (i === active ? ' on' : '') + '" data-i="' + i + '" role="option" aria-selected="' + (i === active) + '">'
            + '<span class="pi-ic">' + icon(a.icon) + '</span><span class="pi-label">' + esc(a.label) + '</span><span class="pi-hint">' + esc(a.hint) + '</span></button>';
        });
      });
      list.innerHTML = html || '<div class="palette-empty">没有匹配的命令</div>';
      list.querySelectorAll('.palette-item').forEach((b) => {
        b.addEventListener('pointerenter', () => { active = Number(b.getAttribute('data-i')); draw(); });
        b.addEventListener('click', () => run());
      });
      const on = list.querySelector('.palette-item.on');
      if (on) on.scrollIntoView({ block: 'nearest' });
    }
    function run() {
      const a = filtered[active];
      close();
      if (a) setTimeout(() => a.run(), 60);
    }
    function close() {
      mask.classList.remove('on');
      setTimeout(() => mask.remove(), 160);
      paletteNode = null;
      document.removeEventListener('keydown', onKey, true);
    }
    function onKey(e) {
      if (e.key === 'Escape') { e.preventDefault(); close(); }
      else if (e.key === 'ArrowDown') { e.preventDefault(); active = Math.min(filtered.length - 1, active + 1); draw(); }
      else if (e.key === 'ArrowUp') { e.preventDefault(); active = Math.max(0, active - 1); draw(); }
      else if (e.key === 'Enter') { e.preventDefault(); run(); }
    }
    input.addEventListener('input', () => {
      const q = input.value.trim().toLowerCase();
      filtered = actions.filter((a) => (a.group + ' ' + a.label + ' ' + a.hint).toLowerCase().includes(q));
      active = 0;
      draw();
    });
    mask.addEventListener('pointerdown', (e) => { if (e.target === mask) close(); });
    document.addEventListener('keydown', onKey, true);
    draw();
    requestAnimationFrame(() => { mask.classList.add('on'); input.focus(); });
  }

  /* -------------------------------- 路由 ---------------------------------- */

    about() {
      sheet({

        body: '<div class="about">'
          + '<p><b>API 用量统计 · 匿名遥测</b>看板：数据来自扩展的匿名上报，口径与 <code>cloudflare/summary.js</code> 一致，全部为设备维度的聚合计数，不含对话内容、模型名、密钥、金额与 IP。</p>'

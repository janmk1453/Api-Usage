name = "api-usage-stat"
main = "worker.js"
compatibility_date = "2026-04-01"
# 保持 workers.dev 域名可用（部分用户可直连）；如需关闭改为 false
workers_dev = true
# 关闭每次上传生成的预览 URL，减少无意义的外部暴露
preview_urls = false

# 看板页作为文本模块打包进 Worker（单文件零依赖，不需要外部图表库或静态资源托管）
[[rules]]
type = "Text"
globs = ["**/*.html"]
fallthrough = true

[[d1_databases]]
binding = "DB"
database_name = "api_usage_stat"
# D1 数据库 ID 属于账号私有信息，请勿提交真实值。
# 做法：把本文件复制为 wrangler.local.toml（已在 .gitignore 中忽略），填入 `npx wrangler d1 create api_usage_stat`
# 返回的 database_id，然后使用 `npx wrangler deploy -c wrangler.local.toml` 部署。
database_id = "REPLACE_WITH_D1_DATABASE_ID"

# 发信绑定：Workers 免费版可用，需账户已 onboard 发信域名（janmk.us.ci）
# destination_address 把收件人锁死为已验证地址，避免绑定了发信能力却被拿去发垃圾邮件
[[send_email]]
name = "EMAIL"
destination_address = "2855564331@qq.com"

# 邮件相关变量：主题/正文/链接都从这里取，改收件人不用改代码
[vars]
MAIL_TO = "2855564331@qq.com"
MAIL_FROM = "noreply@janmk.us.ci"
PANEL_URL = "https://stat.janmk.us.ci/dashboard"

# 每月 1 号 03:00 UTC 清理过期数据；每天 16:00 UTC（北京 0 点）发前一日总结
[triggers]
crons = ["0 3 1 * *", "0 16 * * *"]

# 可选：绑定自定义域名后，把下面的注释打开并修改 pattern，客户端常量同步改成该域名
# [[routes]]
# pattern = "stat.example.com"
# custom_domain = true

[observability]
enabled = false
